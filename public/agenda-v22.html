<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka 2027</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f7f9fd}iframe{width:100vw;height:100dvh;border:0;display:block}</style></head><body><iframe id="agenda" src="/agenda-v21.html?v=21.1" title="Agenda Yeka 2027"></iframe><script>const VIDEO='https://www.youtube.com/watch?v=8qwUtzzHTj4&t=37s';const STORE='agenda-yeka-platform-v21';function seed(){let s={};try{s=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){s={}}s.student=s.student||{name:'Yeka',email:'',phone:'',level:'',goal:'',registered:false};s.artists=s.artists||[{name:'',image:''},{name:'',image:''},{name:'',image:''}];s.notes=s.notes||{goals:'',routine:'',coach:''};s.days=s.days||{};s.insp=s.insp||'';s.likes=s.likes||'';s.saved=s.saved||false;s.bag=s.bag||false;for(let m=0;m<12;m++){let total=new Date(2027,m+1,0).getDate();for(let d=1;d<=total;d++){let k=`2027-${m+1}-${d}`;s.days[k]=s.days[k]||{video:'',learned:'',obs:'',status:'Pendiente'};s.days[k].video=VIDEO;if(!s.days[k].status)s.days[k].status='Pendiente'}}localStorage.setItem(STORE,JSON.stringify(s))}seed();const frame=document.getElementById('agenda');function fit(){frame.style.height=(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px'}fit();window.visualViewport&&window.visualViewport.addEventListener('resize',fit);window.addEventListener('resize',fit);</script></body></html>
