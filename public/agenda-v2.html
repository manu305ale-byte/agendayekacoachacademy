<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Yeka Coach Academy 2027</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet"><style>:root{--navy:#101932;--pink:#ed2f8f;--orange:#ff7a1a;--teal:#15aaa4;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 0 25%,#fde8f4,transparent 22%),radial-gradient(circle at 100% 30%,#dcfffa,transparent 24%),#fbfcff;color:#111827}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.app.closed{grid-template-columns:0 1fr}.side{background:#fff;border-right:1px solid #edf0f5;box-shadow:16px 0 42px #141c2d10;padding:26px 22px;overflow:hidden;transition:.25s}.closed .side{transform:translateX(-100%)}.brand{display:flex;gap:10px;align-items:center}.brand i{font-size:38px;color:var(--pink);font-style:normal}.brand b{display:block;font-family:Playfair Display,serif;font-size:25px;color:var(--navy)}.brand span{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#7b8495;font-weight:800}.toggle,.open{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 10px 28px #141c2d20;font-weight:900;margin:25px auto;display:grid;place-items:center}.open{position:fixed;left:18px;top:18px;z-index:5}.nav{display:grid;gap:12px}.nav button{border:0;border-radius:18px;background:transparent;height:50px;display:flex;gap:14px;align-items:center;padding:0 16px;font-weight:900;color:#111827}.nav button:hover,.nav button.active{background:#ffe4f2;color:var(--pink)}.card{margin-top:40px;border-radius:22px;padding:22px;background:linear-gradient(145deg,#fff,#f5edff,#fff6fb);box-shadow:0 18px 40px #141c2d14}.card .badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--pink);border:1px dashed var(--pink);font-size:24px}.card p{color:var(--muted);font-size:14px;line-height:1.4}.hide{position:absolute;left:0;bottom:0;width:250px;padding:20px;text-align:center;border-top:1px solid #eef0f5;font-weight:800;color:#526074;background:#fff;cursor:pointer}.work{position:relative;min-height:100vh;padding:26px 34px 28px}.top{height:48px;display:flex;justify-content:space-between;align-items:center}.saved{background:#e8fbf3;color:#08755f;border-radius:999px;padding:9px 14px;font-weight:900}.profile{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f8c9a5,#b96b42);color:#fff;font-weight:900}.letter{width:min(850px,calc(100vw - 360px));aspect-ratio:8.5/11;margin:8px auto 0;background:#fffefb;border-radius:18px 18px 12px 12px;box-shadow:0 22px 60px #141c2d24;position:relative;padding:58px 34px 30px;animation:flip .28s ease}.closed .letter{width:min(850px,calc(100vw - 120px))}@keyframes flip{from{opacity:.3;transform:rotateY(-9deg) translateX(20px)}to{opacity:1;transform:none}}.rings{position:absolute;left:34px;right:34px;top:-28px;height:54px;display:flex;justify-content:space-between}.rings span{width:16px;height:60px;border:5px solid #19191b;border-bottom:0;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#111,#ddd 35%,#111 65%,#222)}.inner{height:100%;display:flex;flex-direction:column;gap:18px}.hero{text-align:center}.hero h1{font-family:Playfair Display,serif;font-size:clamp(32px,4vw,50px);line-height:.9;margin:0;color:var(--navy)}.hero h2{font-family:Playfair Display,serif;font-size:clamp(28px,3.5vw,44px);font-style:italic;margin:0;background:linear-gradient(90deg,var(--pink),var(--orange),var(--teal));-webkit-background-clip:text;color:transparent}.hero p{color:#3e4658;font-size:13px}.artists{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.artist{position:relative;min-height:210px;border:2px solid;border-radius:16px;background:#fff;display:grid;justify-items:center;padding:24px 16px 16px}.artist:nth-child(1){border-color:#ff4fa4}.artist:nth-child(2){border-color:#ff8a2c}.artist:nth-child(3){border-color:#2abdb8}.num{position:absolute;left:-12px;top:-12px;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}.artist:nth-child(1) .num{background:var(--pink)}.artist:nth-child(2) .num{background:var(--orange)}.artist:nth-child(3) .num{background:var(--teal)}.upload{width:116px;height:116px;border:2px dashed #ddd;border-radius:50%;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;cursor:pointer}.upload input{position:absolute;inset:0;opacity:0}.upload img{width:100%;height:100%;object-fit:cover}.upload small{font-size:10px;color:#4b5565}.artist-name,.field input,.field select{width:100%;height:38px;border:1px solid #d7dee9;border-radius:10px;padding:0 12px}.artist-name{border:0;text-align:center;font-weight:900;margin-top:12px}.artist:nth-child(1) .artist-name{background:#fdebf4;color:#8f144c}.artist:nth-child(2) .artist-name{background:#fff0e4;color:#c34c00}.artist:nth-child(3) .artist-name{background:#eaf9f7;color:#05726f}.mini,.field textarea,.notes{width:100%;border:1px solid #d7dee9;border-radius:10px;padding:10px;resize:vertical}.mini{height:58px;margin-top:10px}.question{display:grid;grid-template-columns:48px 1fr;gap:14px}.qicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ffe8f4;color:var(--pink)}.question label,.field{font-weight:900;color:var(--navy)}.question p{margin:0 0 8px;color:var(--muted);font-size:12px}.question textarea{height:86px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 21px,#dbeafd 22px,#dbeafd 23px)}.banner{margin-top:auto;min-height:126px;border:1px solid #ffd393;border-radius:18px;background:linear-gradient(90deg,#fff6e4,#fff1d6);display:flex;align-items:center;padding:20px;position:relative;overflow:hidden}.banner strong,.banner span{font-family:Playfair Display,serif;font-size:30px;display:block}.banner span{background:linear-gradient(90deg,var(--pink),var(--orange),var(--teal));-webkit-background-clip:text;color:transparent}.bag{margin-left:auto;font-size:80px}.controls{width:min(850px,calc(100vw - 360px));margin:16px auto 0;display:flex;justify-content:space-between;gap:12px}.closed .controls{width:min(850px,calc(100vw - 120px))}.btn,.save{border:0;border-radius:999px;padding:13px 20px;font-weight:900;box-shadow:0 10px 22px #2b292620}.btn{background:#fff;color:var(--navy)}.save{background:var(--navy);color:#fff}.field{display:grid;gap:8px}.student-grid,.two{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.weekday{text-align:center;font-weight:900;color:var(--muted);font-size:12px}.day{min-height:58px;border:2px solid #dbe4ef;border-radius:14px;background:#fff;display:grid;place-items:center;font-weight:900}.day small{font-size:9px;color:var(--muted)}.day.completado{background:#e8fbf3;border-color:var(--teal)}.video{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:center;background:#f8fafc;border-radius:16px;padding:12px}.video iframe{width:100%;height:160px;border:0;border-radius:12px}.bigbag{font-size:160px;border:0;background:transparent}.baginfo{display:grid;gap:10px}.baginfo article{display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 12px 25px #141c2d14}.baginfo img{width:60px;height:60px;border-radius:14px;object-fit:cover}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.progress article{background:#fff;border-radius:20px;padding:24px;text-align:center;box-shadow:0 14px 30px #141c2d10}.progress strong{font-size:44px;color:var(--teal);display:block}.cover{display:grid;place-items:center;text-align:center;height:100%}.cover .suit{font-size:140px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:9;width:260px;inset:0 auto 0 0}.letter,.closed .letter,.controls,.closed .controls{width:100%;aspect-ratio:auto}.artists,.student-grid,.two,.video,.progress{grid-template-columns:1fr}.letter{min-height:900px}.work{padding:18px}}</style></head><body><div id="root"></div><script>const VIDEO='https://www.youtube.com/watch?v=_uwnqpiz-bM';const STORE='agenda-yeka-2027-html';const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const pages=['cover','student','artists','suitcase','goals','routine',...months.map((_,i)=>'month-'+i),'progress','coach','backcover'];const blank={student:{name:'',email:'',phone:'',level:'',goal:''},artists:[{name:'',image:'',note:''},{name:'',image:'',note:''},{name:'',image:'',note:''}],otherArtists:'',artistNotes:'',suitcaseSaved:false,goals:'',routine:'',coachNotes:'',days:{}};let data=JSON.parse(localStorage.getItem(STORE)||JSON.stringify(blank));let page=0,menu=true,sel=null,bag=false,saved='';const root=document.getElementById('root');function k(m,d){return`2027-${m+1}-${d}`}function entry(m,d){return data.days[k(m,d)]||{videos:[VIDEO],learned:'',observations:'',mood:'',status:'Pendiente'}}function persist(msg='Guardado'){localStorage.setItem(STORE,JSON.stringify(data));saved=msg;render();setTimeout(()=>{saved='';render()},1500)}function days(m){return new Date(2027,m+1,0).getDate()}function embed(u){return 'https://www.youtube.com/embed/'+((u.match(/[?&]v=([^&]+)/)||[])[1]||'_uwnqpiz-bM')}function navTo(i){sel=null;page=i;render()}function upload(i,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{data.artists[i].image=r.result;render()};r.readAsDataURL(f)}function render(){const cur=pages[page],mi=cur.startsWith('month-')?Number(cur.split('-')[1]):-1;root.innerHTML=`<main class="app ${menu?'':'closed'}"><aside class="side"><div class="brand"><i>♪</i><div><b>Voz en Ruta</b><span>Academia de canto</span></div></div><button class="toggle" onclick="menu=!menu;render()">${menu?'≪':'☰'}</button><nav class="nav">${['Portada','Registro','Cantantes','Calendario','Mi Maleta','Progreso'].map((n,i)=>`<button onclick="${i===3?'sel=null;page=6;render()':i===4?'navTo(3)':i===5?'navTo(pages.length-3)':'navTo('+i+')'}"><span>${['⌂','✎','♪','▦','▣','▥'][i]}</span><b>${n}</b></button>`).join('')}</nav><div class="card"><div class="badge">★</div><h3>Tu viaje vocal</h3><p>${Object.values(data.days).filter(d=>d.status==='Completado').length} días completados.</p></div><div class="hide" onclick="menu=false;render()">← Ocultar menú</div></aside>${!menu?'<button class="open" onclick="menu=true;render()">☰</button>':''}<section class="work"><header class="top"><b>${sel?'Día '+sel.d:'Página '+Math.min(page+1,30)+' de 30'}</b><div class="profile">${saved?'<span class="saved">✓ '+saved+'</span>':''}<div class="avatar">${(data.student.name||'V')[0].toUpperCase()}</div><div><b>${data.student.name||'Valeria'}</b><br><small>Estudiante</small></div></div></header><section class="letter"><div class="rings">${Array.from({length:18}).map(()=>'<span></span>').join('')}</div><div class="inner">${sel?dayPage(sel.m,sel.d):basePage(cur,mi)}</div></section><div class="controls"><button class="btn" onclick="back()">${sel?'← Volver al mes':'← Retroceder'}</button><button class="save" onclick="persist()">Guardar agenda</button><button class="btn" ${sel||page===pages.length-1?'disabled':''} onclick="next()">Avanzar →</button></div></section></main>`}function back(){if(sel){page=6+sel.m;sel=null}else page=Math.max(0,page-1);render()}function next(){if(!sel)page=Math.min(pages.length-1,page+1);render()}function basePage(cur,mi){if(cur==='cover')return`<div class="cover"><div class="hero"><h1>Agenda Vocal 2027</h1><h2>El viaje de tu voz</h2><p>Una agenda interactiva para entrenar, descubrir y guardar todo lo que construyes con tu voz.</p></div><div class="suit">🧳</div><button class="save" onclick="navTo(1)">Comenzar viaje</button></div>`;if(cur==='student')return`<div><div class="hero"><h1>Registro del alumno</h1><h2>Datos personales</h2><p>Información individual del alumno.</p></div><div class="student-grid">${['name:Nombre','email:Correo','phone:Teléfono','level:Nivel vocal','goal:Objetivo'].map(x=>{let[a,b]=x.split(':');return`<label class="field">${b}<input value="${data.student[a]||''}" oninput="data.student.${a}=this.value"></label>`}).join('')}</div><br><button class="save" onclick="persist('Alumno guardado')">Guardar alumno</button></div>`;if(cur==='artists')return artistsPage();if(cur==='suitcase')return suitcasePage();if(cur==='goals'||cur==='routine'||cur==='coach'){let prop=cur==='goals'?'goals':cur==='routine'?'routine':'coachNotes';return`<div><div class="hero"><h1>${cur==='goals'?'Objetivos de mi voz':cur==='routine'?'Rutina vocal diaria':'Notas del coach'}</h1><h2>Viaje vocal</h2><p>Esta página se guarda dentro del proceso.</p></div><textarea class="notes" style="height:420px" oninput="data.${prop}=this.value">${data[prop]||''}</textarea></div>`}if(mi>=0)return monthPage(mi);if(cur==='progress')return`<div><div class="hero"><h1>Mi progreso</h1><h2>Ruta 2027</h2><p>Resumen del camino vocal registrado.</p></div><div class="progress"><article><strong>${Object.values(data.days).filter(d=>d.status==='Completado').length}</strong><span>Días completados</span></article><article><strong>${data.artists.filter(a=>a.name).length}</strong><span>Artistas guardados</span></article><article><strong>${Object.keys(data.days).length}</strong><span>Días usados</span></article></div></div>`;return`<div class="cover"><div class="hero"><h1>Contraportada</h1><h2>Tu maleta vocal</h2><p>Todo lo aprendido queda guardado en tu viaje.</p></div><div class="suit">🧳</div></div>`}function artistsPage(){return`<div class="hero"><h1>Top 3 de Cantantes</h1><h2>que te inspiran</h2><p>Elige a esos artistas que te motivan, te emocionan y te hacen querer seguir cantando.</p></div><section class="artists">${data.artists.map((a,i)=>`<article class="artist"><div class="num">${i+1}</div><label class="upload">${a.image?`<img src="${a.image}">`:'<small>Adjunta una foto<br>del artista</small>'}<input type="file" accept="image/*" onchange="upload('+i+',this)"></label><input class="artist-name" value="${a.name}" oninput="data.artists[${i}].name=this.value" placeholder="Nombre del artista"><textarea class="mini" oninput="data.artists[${i}].note=this.value" placeholder="¿Qué te inspira?">${a.note}</textarea></article>`).join('')}</section><section class="question"><div class="qicon">♡</div><div><label>¿Hay algunos más que te inspiran?</label><input class="artist-name" value="${data.otherArtists}" oninput="data.otherArtists=this.value" placeholder="Escribe otros artistas"></div></section><section class="question"><div class="qicon">♪</div><div><label>¿Qué te gusta de estos artistas?</label><textarea oninput="data.artistNotes=this.value">${data.artistNotes}</textarea></div></section><section class="banner"><div><strong>¡Vamos a llevarlos</strong><span>en tu maleta!</span></div><div class="bag">🧳</div></section><button class="save" onclick="data.suitcaseSaved=true;persist('Artistas guardados')">Guardar artistas en mi maleta</button>`}function suitcasePage(){return`<div class="hero"><h1>Mi maleta vocal</h1><h2>Tus artistas guardados</h2><p>Haz clic en la maleta para abrirla.</p></div><div style="text-align:center"><button class="bigbag" onclick="bag=!bag;render()">🧳</button></div>${bag?`<div class="baginfo">${data.artists.filter(a=>a.name||a.image).map(a=>`<article>${a.image?`<img src="${a.image}">`:''}<div><b>${a.name||'Artista'}</b><p>${a.note||'Sin nota todavía'}</p></div></article>`).join('')}</div>`:''}`}function monthPage(m){let first=new Date(2027,m,1).getDay(),arr=Array.from({length:days(m)},(_,i)=>i+1);return`<div class="hero"><h1>${months[m]} 2027</h1><h2>Calendario de viaje vocal</h2><p>Selecciona un día para abrir su página individual.</p></div><div class="calendar">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(w=>`<span class="weekday">${w}</span>`).join('')}${Array.from({length:first}).map(()=>'<span></span>').join('')}${arr.map(d=>{let e=entry(m,d);return`<button class="day ${e.status.toLowerCase().replaceAll(' ','-')}" onclick="sel={m:${m},d:${d}};render()"><b>${d}</b><small>${e.status}</small></button>`}).join('')}</div>`}function dayPage(m,d){let e=entry(m,d);return`<div class="hero"><h1>${d} de ${months[m]} 2027</h1><h2>Parada vocal del día</h2><p>Video asignado, aprendizaje y observaciones.</p></div><section class="video"><iframe src="${embed(e.videos[0])}" allowfullscreen></iframe><div><b>Video del día</b><br><a target="_blank" href="${e.videos[0]}">Abrir en YouTube</a></div></section><label class="field">¿Qué aprendí hoy?<textarea oninput="entry(${m},${d}).learned=this.value">${e.learned}</textarea></label><label class="field">Observaciones<textarea oninput="entry(${m},${d}).observations=this.value">${e.observations}</textarea></label><div class="two"><label class="field">¿Cómo me sentí?<input value="${e.mood}" oninput="entry(${m},${d}).mood=this.value"></label><label class="field">Estado<select onchange="entry(${m},${d}).status=this.value"><option ${e.status==='Pendiente'?'selected':''}>Pendiente</option><option ${e.status==='En proceso'?'selected':''}>En proceso</option><option ${e.status==='Completado'?'selected':''}>Completado</option><option ${e.status==='Necesito ayuda'?'selected':''}>Necesito ayuda</option></select></label></div><button class="save" onclick="data.days['${k(m,d)}']=entry(${m},${d});persist('Día guardado')">Guardar este día</button>`}render();</script></body></html>
