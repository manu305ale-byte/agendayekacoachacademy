<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f7f9fd}iframe{width:100vw;height:100dvh;border:0;display:block}</style></head><body><iframe id="agenda" src="/agenda-v41.html?v=41.1" title="Agenda"></iframe><script>const frame=document.getElementById('agenda');const STORE='agenda-yeka-v41';function fit(){frame.style.height=((window.visualViewport&&window.visualViewport.height)||window.innerHeight)+'px'}fit();addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);function getDoc(){try{return frame.contentWindow.document}catch(e){return null}}function getData(){try{return JSON.parse(frame.contentWindow.localStorage.getItem(STORE)||'{}')}catch(e){return {}}}function setData(d){try{frame.contentWindow.localStorage.setItem(STORE,JSON.stringify(d))}catch(e){}}function editBag(){let data=getData();data.bagSaved=false;data.bagOpen=false;setData(data);try{frame.contentWindow.render&&frame.contentWindow.render()}catch(e){}setTimeout(patch,80)}function patch(){try{const d=getDoc();if(!d||!d.head)return;let st=d.getElementById('edit-bag-v42');if(!st){st=d.createElement('style');st.id='edit-bag-v42';d.head.appendChild(st)}st.textContent='.bagEdit{border:0;border-radius:999px;min-height:46px;padding:0 24px;background:linear-gradient(90deg,#d8f4ca,#a4e6dd);color:#14213d;font:400 28px Patrick Hand,cursive;box-shadow:0 14px 28px rgba(20,33,61,.16);margin:4px auto 0;display:block}.bagActions{display:grid;gap:12px;place-items:center}.bagActions .bagClose{margin:0}@media(max-width:900px){.bagEdit{font-size:26px;min-height:44px}}';const content=d.getElementById('content');if(!content)return;const txt=(content.innerText||'').toLowerCase();const data=getData();if(!txt.includes('maleta vocal')||!data.bagSaved)return;if(content.querySelector('#editBagBtn'))return;const closeBtn=content.querySelector('.bagClose');if(closeBtn){let actions=d.createElement('div');actions.className='bagActions';closeBtn.parentNode.insertBefore(actions,closeBtn);actions.appendChild(closeBtn);let b=d.createElement('button');b.id='editBagBtn';b.className='bagEdit';b.textContent='Editar maleta';b.onclick=editBag;actions.appendChild(b)}else{let center=content.querySelector('.bagCenter');if(center){let b=d.createElement('button');b.id='editBagBtn';b.className='bagEdit';b.textContent='Editar maleta';b.onclick=editBag;center.appendChild(b)}}}catch(e){}}frame.addEventListener('load',()=>{patch();setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2000)});setInterval(patch,700);window.editBag=editBag;</script></body></html>
