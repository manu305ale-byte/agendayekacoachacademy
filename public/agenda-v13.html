<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka Flipbook 2027</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#fbfcff}iframe{width:100vw;height:100dvh;border:0;display:block}</style></head><body><iframe id="agenda" src="/agenda-v12.html?v=12.0" title="Agenda Yeka Flipbook 2027"></iframe><script>const frame=document.getElementById('agenda');function fit(){frame.style.height=(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px'}fit();window.visualViewport&&window.visualViewport.addEventListener('resize',fit);window.addEventListener('resize',fit);frame.addEventListener('load',()=>{try{const doc=frame.contentDocument||frame.contentWindow.document;const css=`
.work{perspective:1400px!important;perspective-origin:center top!important;background:radial-gradient(circle at 50% 100%,rgba(17,25,50,.10),transparent 34%),radial-gradient(circle at 0 25%,rgba(239,43,145,.10),transparent 22%),radial-gradient(circle at 100% 28%,rgba(216,194,255,.18),transparent 24%),#fbfcff!important}.letter{transform-origin:top center!important;transform-style:preserve-3d!important;transition:transform .58s cubic-bezier(.2,.8,.2,1),box-shadow .58s ease!important;position:relative!important}.letter:after{content:''!important;position:absolute!important;left:4%!important;right:4%!important;bottom:-28px!important;height:34px!important;background:linear-gradient(180deg,rgba(17,25,50,.18),rgba(17,25,50,.02))!important;filter:blur(10px)!important;border-radius:50%!important;z-index:-3!important}.letter.flip-up{animation:flipUp .72s cubic-bezier(.2,.8,.2,1)!important}.letter.flip-down{animation:flipDown .72s cubic-bezier(.2,.8,.2,1)!important}@keyframes flipUp{0%{transform:rotateX(0deg) translateY(0);opacity:1}42%{transform:rotateX(-44deg) translateY(-22px) scale(.985);opacity:.72;box-shadow:0 46px 90px rgba(18,26,54,.24)}100%{transform:rotateX(0deg) translateY(0);opacity:1}}@keyframes flipDown{0%{transform:rotateX(0deg) translateY(0);opacity:1}42%{transform:rotateX(36deg) translateY(24px) scale(.985);opacity:.76;box-shadow:0 46px 90px rgba(18,26,54,.22)}100%{transform:rotateX(0deg) translateY(0);opacity:1}}.letter .rings{filter:drop-shadow(0 8px 5px rgba(0,0,0,.2))!important}.letter:before{transform-origin:top center!important}.flipbook-base{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);width:min(760px,86%);height:46px;border-radius:0 0 28px 28px;background:linear-gradient(180deg,#f7f0df,#ded2bd);box-shadow:0 16px 34px rgba(17,25,50,.18),inset 0 1px 0 rgba(255,255,255,.85);z-index:-2;pointer-events:none}.flipbook-base:after{content:'';position:absolute;left:8%;right:8%;bottom:-11px;height:16px;border-radius:50%;background:rg `;const st=doc.createElement('style');st.setAttribute('data-agenda-v13-flipbook','true');st.textContent=css;doc.head.appendChild(st);const letter=()=>doc.querySelector('.letter');const work=doc.querySelector('.work');if(work&&!doc.querySelector('.desk-caption')){const cap=doc.createElement('div');cap.className='desk-caption';cap.textContent='Flipbook vocal';work.appendChild(cap)}function addBase(){const l=letter();if(l&&!l.querySelector('.flipbook-base')){const base=doc.createElement('div');base.className='flipbook-base';l.appendChild(base)}}addBase();const obs=new MutationObserver(()=>addBase());obs.observe(doc.body,{childList:true,subtree:true});function flip(dir='up'){const l=letter();if(!l)return;l.classList.remove('flip-up','flip-down');void l.offsetWidth;l.classList.add(dir==='down'?'flip-down':'flip-up');setTimeout(()=>l.classList.remove('flip-up','flip-down'),760)}doc.addEventListener('click',e=>{const t=e.target;if(!t||!t.closest)return;const next=t.closest('.controls .btn:last-child,.banner + .save,.inner>.save,.cover .save,.cover-content .save,.day,.nav button');const prev=t.closest('.controls .btn:first-child');if(next)setTimeout(()=>flip('up'),20);if(prev)setTimeout(()=>flip('down'),20)},true);let startY=0,startX=0,tracking=false;doc.addEventListener('touchstart',e=>{if(!e.touches||!e.touches[0])return;startY=e.touches[0].clientY;startX=e.touches[0].clientX;tracking=true},{passive:true});doc.addEventListener('touchend',e=>{if(!tracking||!e.changedTouches||!e.changedTouches[0])return;const dy=e.changedTouches[0].clientY-startY;const dx=e.changedTouches[0].clientX-startX;tracking=false;if(Math.abs(dy)>70&&Math.abs(dy)>Math.abs(dx)*1.4){if(dy<0){const btn=doc.querySelector('.controls .btn:last-child');if(btn&&!btn.disabled)btn.click()}else{const btn=doc.querySelector('.controls .btn:first-child');if(btn)btn.click()}}},{passive:true});if(!doc.querySelector('.mobile-flip-hint')){const hint=doc.createElement('div');hint.className='mobile-flip-hint';hint.textC
