lative;z-index:1}.paper{position:relative!important;overflow:hidden;padding-top:96px!important}.paper:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.10;background-image:url(/fondo-pagina.svg);background-size:390px 505px;background-repeat:repeat}.paper>*{position:relative;z-index:1}#studentPanel{display:none!important}.rings{display:block!important;position:absolute!important;left:30px!important;right:30px!important;top:0!important;height:64px!important;z-index:20!important;background:url(/anillos.svg?v=3) center top/100% 100% no-repeat!important}.rings *{display:none!important;visibility:hidden!important;opacity:0!important}@media(max-width:900px){body:before{opacity:.24;background-size:245px 317px}.paper{padding-top:82px!important}.paper:before{opacity:.08;background-size:275px 356px}.rings{left:18px!important;right:18px!important;top:0!important;height:52px!important;background-size:100% 100%!important}}';d.head.appendChild(s)}cleanPages(d)}function apply(){try{let d=f.contentWindow.document;for(let i=0;i<8&&d;i++){add(d);let inner=d.querySelector('iframe');d=inner?inner.contentWindow.document:null}}catch(e){}}f.addEventListener('load',()=>{apply();setTimeout(apply,300);setTimeout(apply,900);setTimeout(apply,1800)});setInterval(apply,1200);</script></body></html>
