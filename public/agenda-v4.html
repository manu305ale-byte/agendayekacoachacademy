<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Yeka Coach Academy 2027</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet"><style>:root{--navy:#101932;--pink:#ee2d91;--violet:#8b5cf6;--lilac:#eadcff;--orange:#ff7a1a;--teal:#16aaa4;--soft:#fff7fb;--muted:#687083}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy);background:radial-gradient(circle at 0 20%,#ffdff0,transparent 20%),radial-gradient(circle at 100% 25%,#e5dcff,transparent 22%),radial-gradient(circle at 85% 85%,#dffaf6,transparent 20%),#fbfcff}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.app.closed{grid-template-columns:0 1fr}.side{position:relative;background:#fff;border-right:1px solid #edf0f5;box-shadow:16px 0 40px #18203312;padding:26px 22px;transition:.25s;overflow:hidden}.closed .side{transform:translateX(-105%);opacity:0}.brand{display:flex;gap:10px;align-items:center}.brand i{font-size:40px;color:var(--pink);font-style:normal}.brand b{font:900 25px Playfair Display,serif;display:block}.brand span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7b8495;font-weight:900}.toggle,.open{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 10px 25px #18203322;font-weight:900}.toggle{margin:26px auto;display:grid;place-items:center}.open{position:fixed;left:18px;top:18px;z-index:50}.nav{display:grid;gap:12px}.nav button{height:52px;border:0;border-radius:18px;background:transparent;display:flex;gap:14px;align-items:center;padding:0 16px;font-weight:900;color:var(--navy)}.nav button:hover{background:linear-gradient(90deg,#ffe4f3,#f3ecff);color:var(--pink)}.journey{margin-top:42px;border-radius:24px;padding:22px;background:linear-gradient(145deg,#fff,#f2ebff 55%,#fff0f7);box-shadow:0 18px 40px #18203314}.journey .badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--pink);color:var(--pink);font-size:24px;background:#fff}.journey p{color:var(--muted);font-size:14px}.hide{position:absolute;left:0;right:0;bottom:0;padding:20px;text-align:center;border-top:1px solid #eef0f5;font-weight:900;color:#526074;cursor:pointer}.work{position:relative;min-height:100vh;padding:26px 34px 30px;overflow:hidden}.work:before{content:'♫';position:absolute;left:8%;top:10%;font-size:42px;color:#ff8ac5;transform:rotate(-15deg)}.work:after{content:'✈';position:absolute;right:9%;top:15%;font-size:30px;transform:rotate(12deg)}.top{height:48px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.saved{background:#e8fbf3;color:#08755f;border-radius:999px;padding:9px 14px;font-weight:900}.profile{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f7b0db,#8b5cf6);color:#fff;font-weight:900}.letter{width:min(900px,calc(100vw - 360px));aspect-ratio:8.5/11;margin:8px auto 0;background:linear-gradient(#fffefa,#fffdf9);border-radius:22px 22px 16px 16px;box-shadow:0 26px 80px #18203329;position:relative;padding:66px 42px 34px;animation:flip .3s ease}.closed .letter{width:min(900px,calc(100vw - 120px))}@keyframes flip{from{opacity:.25;transform:rotateY(-8deg) translateX(20px)}to{opacity:1;transform:none}}.rings{position:absolute;left:34px;right:34px;top:-28px;height:54px;display:flex;justify-content:space-between}.rings span{width:16px;height:60px;border:5px solid #19191b;border-bottom:0;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#111,#eee 35%,#111 65%)}.inner{height:100%;display:flex;flex-direction:column;gap:18px}.hero{text-align:center}.hero h1{font:900 clamp(34px,4vw,54px)/.9 Playfair Display,serif;margin:0;color:var(--navy)}.hero h2{font:900 italic clamp(30px,3.6vw,46px)/1 Playfair Display,serif;margin:0;background:linear-gradient(90deg,var(--pink),var(--orange),var(--teal));-webkit-background-clip:text;color:transparent}.hero p{font-size:13px;color:#465066;margin:8px 0 0}.artists{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.artist{position:relative;min-height:230px;border:2.5px solid;border-radius:20px;background:#fff;display:grid;justify-items:center;padding:28px 18px 18px;box-shadow:0 16px 34px #1820330d}.artist:nth-child(1){border-color:#ff4fa4;background:linear-gradient(#fff,#fff7fc)}.artist:nth-child(2){border-color:#ff8a2c;background:linear-gradient(#fff,#fff7f0)}.artist:nth-child(3){border-color:#27beb7;background:linear-gradient(#fff,#f7fffe)}.num{position:absolute;left:-14px;top:-14px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:23px;font-weight:900;box-shadow:0 10px 22px #18203329}.artist:nth-child(1) .num{background:var(--pink)}.artist:nth-child(2) .num{background:var(--orange)}.artist:nth-child(3) .num{background:var(--teal)}.music{position:absolute;right:22px;top:38px;font-size:28px}.artist:nth-child(1) .music{color:#ff7fc0}.artist:nth-child(2) .music{color:#ff8a2c}.artist:nth-child(3) .music{color:#68ccc6}.upload{width:128px;height:128px;border:2px dashed;border-radius:50%;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;cursor:pointer;background:#fff}.artist:nth-child(1) .upload{border-color:#ff4fa4}.artist:nth-child(2) .upload{border-color:#ff8a2c}.artist:nth-child(3) .upload{border-color:#27beb7}.upload input{position:absolute;inset:0;opacity:0}.upload img{width:100%;height:100%;object-fit:cover}.upload small{font-size:10px;color:#4b5565}.artist-name{width:100%;height:42px;border:0;border-radius:12px;text-align:center;font-size:17px;font-weight:900;margin-top:12px}.artist:nth-child(1) .artist-name{background:#fdebf4;color:#8f144c}.artist:nth-child(2) .artist-name{background:#fff0e4;color:#c34c00}.artist:nth-child(3) .artist-name{background:#eaf9f7;color:#05726f}.mini{width:100%;height:72px;margin-top:10px;border:1px solid #e5e7ef;border-radius:14px;padding:10px;resize:vertical;background:#fff;font-size:15px}.questions{display:grid;gap:16px}.question{display:grid;grid-template-columns:58px 1fr;gap:16px;align-items:start;padding:16px 18px;border-radius:22px;background:#fff;border:1px solid #edf0f7;box-shadow:0 14px 30px #1820330d}.qicon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:23px}.question.pink .qicon{background:#ffe1f2;color:var(--pink)}.question.teal .qicon{background:#ddfbf8;color:var(--teal)}.qbody label{display:block;font-size:19px;font-weight:900;margin-bottom:9px}.qbody p{font-size:12px;color:var(--muted);margin:0 0 8px}.qinput{width:100%;height:48px;border:1px solid #d4dbe8;border-radius:14px;padding:0 16px;background:#fff;font-weight:700}.notes{width:100%;min-height:150px;border:1.5px solid #7ed9d2;border-radius:16px;padding:15px;resize:vertical;background:repeating-linear-gradient(#fff 0,#fff 27px,#dceeff 28px,#dceeff 29px);font-weight:600}.banner{margin-top:auto;min-height:150px;border:1px solid #ffd393;border-radius:22px;background:linear-gradient(90deg,#fff5df,#fff0fb);display:flex;align-items:center;padding:24px;box-shadow:0 18px 38px #ff8a2c1c;overflow:hidden}.banner strong,.banner span{font:900 34px/1 Playfair Display,serif;display:block}.banner span{font-style:italic;background:linear-gradient(90deg,var(--pink),var(--orange),var(--teal));-webkit-background-clip:text;color:transparent}.bag{margin-left:auto;font-size:120px;filter:drop-shadow(0 16px 14px #1820332b)}.controls{width:min(900px,calc(100vw - 360px));margin:16px auto 0;display:flex;justify-content:space-between;gap:12px}.closed .controls{width:min(900px,calc(100vw - 120px))}.btn,.save{border:0;border-radius:999px;padding:14px 23px;font-weight:900;box-shadow:0 10px 22px #18203318}.btn{background:#fff;color:var(--navy)}.save{background:linear-gradient(135deg,var(--navy),#26345f);color:#fff}.field{display:grid;gap:8px;font-weight:900}.field input,.field select{height:44px;border:1px solid #d7dee9;border-radius:12px;padding:0 12px}.field textarea,.longnotes{width:100%;min-height:122px;border:1px solid #d7dee9;border-radius:15px;padding:14px;resize:vertical}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.weekday{text-align:center;font-weight:900;color:#637083;font-size:13px}.day{min-height:66px;border:2.5px solid #dbe4ef;border-radius:17px;background:#fff;display:grid;place-items:center;font-weight:900;transition:.18s}.day:nth-child(4n+1){border-color:#ffb9da}.day:nth-child(4n+2){border-color:#c8b5ff}.day:nth-child(4n+3){border-color:#ffc490}.day:nth-child(4n+4){border-color:#9de4df}.day:hover{transform:translateY(-3px);box-shadow:0 12px 22px #18203318}.day small{font-size:9px;color:var(--muted)}.day.completado{background:#e8fbf3;border-color:var(--teal)}.day.en-proceso{background:#fff2e7;border-color:var(--orange)}.day.necesito-ayuda{background:#ffe8f4;border-color:var(--pink)}.video{display:grid;grid-template-columns:1.55fr .45fr;gap:18px;align-items:center;background:#f8fafc;border:1px solid #eef2f7;border-radius:20px;padding:14px}.video iframe{width:100%;height:260px;border:0;border-radius:16px}.bigbag{font-size:210px;border:0;background:transparent;filter:drop-shadow(0 20px 18px #18203322)}.baginfo{display:grid;gap:12px}.baginfo article{display:flex;gap:14px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 12px 25px #18203314}.baginfo img{width:72px;height:72px;border-radius:16px;object-fit:cover}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.progress article{background:#fff;border-radius:20px;padding:24px;text-align:center;box-shadow:0 14px 30px #18203312}.progress strong{font-size:46px;color:var(--teal);display:block}.cover{display:grid;place-items:center;text-align:center;height:100%}.cover .suit{font-size:170px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;width:260px;inset:0 auto 0 0}.letter,.closed .letter,.controls,.closed .controls{width:100%;aspect-ratio:auto}.artists,.grid2,.video,.progress{grid-template-columns:1fr}.letter{min-height:920px}.work{padding:18px}.question{grid-template-columns:1fr}.qicon{margin:auto}.banner{display:grid;text-align:center}.bag{margin:auto}.video iframe{height:220px}}</style></head><body><div id="root"></div><script>const VIDEO='https://www.youtube.com/watch?v=_uwnqpiz-bM';const STORE='agenda-yeka-v4';const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const pages=['cover','student','artists','suitcase','goals','routine',...months.map((_,i)=>'month-'+i),'progress','coach','backcover'];const blank={student:{name:'',email:'',phone:'',level:'',goal:''},artists:[{name:'',image:'',note:''},{name:'',image:'',note:''},{name:'',image:'',note:''}],otherArtists:'',artistNotes:'',days:{},goals:'',routine:'',coachNotes:''};let data=JSON.parse(localStorage.getItem(STORE)||JSON.stringify(blank)),page=0,sel=null,menu=true,bag=false,saved='';const root=document.getElementById('root');function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function k(m,d){return `2027-${m+1}-${d}`}function entry(m,d){return data.days[k(m,d)]||{videos:[VIDEO],learned:'',observations:'',mood:'',status:'Pendiente'}}function persist(msg='Guardado'){localStorage.setItem(STORE,JSON.stringify(data));saved=msg;render();setTimeout(()=>{saved='';render()},1500)}function days(m){return new Date(2027,m+1,0).getDate()}function embed(u){return 'https://www.youtube.com/embed/'+((u.match(/[?&]v=([^&]+)/)||[])[1]||'_uwnqpiz-bM')}function navTo(i){sel=null;page=i;render()}function upload(i,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{data.artists[i].image=r.result;render()};r.readAsDataURL(f)}function render(){let cur=pages[page],mi=cur.startsWith('month-')?+cur.split('-')[1]:-1;root.innerHTML=`<main class="app ${menu?'':'closed'}"><aside class="side"><div class="brand"><i>♪</i><div><b>Voz en Ruta</b><span>Academia de canto</span></div></div><button class="toggle" onclick="menu=!menu;render()">${menu?'≪':'☰'}</button><nav class="nav">${['Portada','Registro','Cantantes','Calendario','Mi Maleta','Progreso'].map((n,i)=>`<button onclick="${i===3?'sel=null;page=6;render()':i===4?'navTo(3)':i===5?'navTo(pages.length-3)':'navTo('+i+')'}"><span>${['⌂','✎','♪','▦','▣','▥'][i]}</span><b>${n}</b></button>`).join('')}</nav><div class="journey"><div class="badge">★</div><h3>Tu viaje vocal</h3><p>${Object.values(data.days).filter(d=>d.status==='Completado').length} días completados.</p></div><div class="hide" onclick="menu=false;render()">← Ocultar menú</div></aside>${!menu?'<button class="open" onclick="menu=true;render()">☰</button>':''}<section class="work"><header class="top"><b>${sel?'Día '+sel.d:'Página '+Math.min(page+1,30)+' de 30'}</b><div class="profile">${saved?'<span class="saved">✓ '+saved+'</span>':''}<div class="avatar">${(data.student.name||'V')[0].toUpperCase()}</div><div><b>${esc(data.student.name)||'Valeria'}</b><br><small>Estudiante</small></div></div></header><section class="letter"><div class="rings">${Array.from({length:18}).map(()=>'<span></span>').join('')}</div><div class="inner">${sel?dayPage(sel.m,sel.d):base(cur,mi)}</div></section><div class="controls"><button class="btn" onclick="back()">${sel?'← Volver al mes':'← Retroceder'}</button><button class="save" onclick="persist()">Guardar agenda</button><button class="btn" ${sel||page===pages.length-1?'disabled':''} onclick="next()">Avanzar →</button></div></section></main>`}function back(){if(sel){page=6+sel.m;sel=null}else page=Math.max(0,page-1);render()}function next(){if(!sel)page=Math.min(pages.length-1,page+1);render()}function base(cur,mi){if(cur==='cover')return`<div class="cover"><div class="hero"><h1>Agenda Vocal 2027</h1><h2>El viaje de tu voz</h2><p>Una agenda interactiva para entrenar, descubrir y guardar todo lo que construyes con tu voz.</p></div><div class="suit">🧳</div><button class="save" onclick="navTo(1)">Comenzar viaje</button></div>`;if(cur==='student')return student();if(cur==='artists')return artists();if(cur==='suitcase')return suitcase();if(cur==='goals'||cur==='routine'||cur==='coach'){let prop=cur==='goals'?'goals':cur==='routine'?'routine':'coachNotes';return`<div><div class="hero"><h1>${cur==='goals'?'Objetivos de mi voz':cur==='routine'?'Rutina vocal diaria':'Notas del coach'}</h1><h2>Viaje vocal</h2><p>Esta página se guarda dentro del proceso.</p></div><textarea class="longnotes" style="height:430px" oninput="data.${prop}=this.value">${esc(data[prop])}</textarea></div>`}if(mi>=0)return month(mi);if(cur==='progress')return progress();return`<div class="cover"><div class="hero"><h1>Contraportada</h1><h2>Tu maleta vocal</h2><p>Todo lo aprendido queda guardado en tu viaje.</p></div><div class="suit">🧳</div></div>`}function student(){return`<div><div class="hero"><h1>Registro del alumno</h1><h2>Datos personales</h2><p>Información individual del alumno.</p></div><div class="grid2">${['name:Nombre','email:Correo','phone:Teléfono','level:Nivel vocal','goal:Objetivo'].map(x=>{let[a,b]=x.split(':');return`<label class="field">${b}<input value="${esc(data.student[a])}" oninput="data.student.${a}=this.value"></label>`}).join('')}</div><br><button class="save" onclick="persist('Alumno guardado')">Guardar alumno</button></div>`}function artists(){return`<div class="hero"><h1>Top 3 de Cantantes</h1><h2>que te inspiran</h2><p>Elige a esos artistas que te motivan, te emocionan y te hacen querer seguir cantando.</p></div><section class="artists">${data.artists.map((a,i)=>`<article class="artist"><div class="num">${i+1}</div><div class="music">♪</div><label class="upload">${a.image?`<img src="${a.image}">`:'<small>Adjunta una foto<br>del artista</small>'}<input type="file" accept="image/*" onchange="upload(${i},this)"></label><input class="artist-name" value="${esc(a.name)}" oninput="data.artists[${i}].name=this.value" placeholder="Nombre del artista"><textarea class="mini" oninput="data.artists[${i}].note=this.value" placeholder="¿Qué te inspira?">${esc(a.note)}</textarea></article>`).join('')}</section><section class="questions"><div class="question pink"><div class="qicon">♡</div><div class="qbody"><label>¿Hay algunos más que te inspiran?</label><input class="qinput" value="${esc(data.otherArtists)}" oninput="data.otherArtists=this.value" placeholder="Escribe otros artistas que también te motivan..."></div></div><div class="question teal"><div class="qicon">♪</div><div class="qbody"><label>¿Qué te gusta de estos artistas?</label><p>Cuéntanos qué admiras de su voz, su estilo, sus canciones o su historia.</p><textarea class="notes" oninput="data.artistNotes=this.value" placeholder="Escribe aquí tus observaciones...">${esc(data.artistNotes)}</textarea></div></div></section><section class="banner"><div><strong>¡Vamos a llevarlos</strong><span>en tu maleta!</span></div><div class="bag">🧳</div></section><button class="save" onclick="persist('Artistas guardados')">Guardar artistas en mi maleta</button>`}function suitcase(){return`<div class="hero"><h1>Mi maleta vocal</h1><h2>Tus artistas guardados</h2><p>Haz clic en la maleta para abrirla.</p></div><div style="text-align:center"><button class="bigbag" onclick="bag=!bag;render()">🧳</button></div>${bag?`<div class="baginfo">${data.artists.filter(a=>a.name||a.image).map(a=>`<article>${a.image?`<img src="${a.image}">`:''}<div><b>${esc(a.name)||'Artista'}</b><p>${esc(a.note)||'Sin nota todavía'}</p></div></article>`).join('')||'<p style="text-align:center;color:#687083;font-weight:800">Todavía no hay artistas guardados.</p>'}</div>`:''}`}function month(m){let first=new Date(2027,m,1).getDay(),arr=Array.from({length:days(m)},(_,i)=>i+1);return`<div class="hero"><h1>${months[m]} 2027</h1><h2>Calendario de viaje vocal</h2><p>Selecciona un día para abrir su página individual.</p></div><div class="calendar">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(w=>`<span class="weekday">${w}</span>`).join('')}${Array.from({length:first}).map(()=>'<span></span>').join('')}${arr.map(d=>{let e=entry(m,d);return`<button class="day ${e.status.toLowerCase().replaceAll(' ','-')}" onclick="sel={m:${m},d:${d}};render()"><b>${d}</b><small>${e.status}</small></button>`}).join('')}</div>`}function dayPage(m,d){let e=entry(m,d);return`<div class="hero"><h1>${d} de ${months[m]} 2027</h1><h2>Parada vocal del día</h2><p>Video asignado, aprendizaje y observaciones.</p></div><section class="video"><iframe src="${embed(e.videos[0])}" allowfullscreen></iframe><div><b>Video del día</b><br><a target="_blank" href="${e.videos[0]}">Abrir en YouTube</a></div></section><label class="field">¿Qué aprendí hoy?<textarea oninput="entry(${m},${d}).learned=this.value">${esc(e.learned)}</textarea></label><label class="field">Observaciones<textarea oninput="entry(${m},${d}).observations=this.value">${esc(e.observations)}</textarea></label><div class="grid2"><label class="field">¿Cómo me sentí?<input value="${esc(e.mood)}" oninput="entry(${m},${d}).mood=this.value"></label><label class="field">Estado<select onchange="entry(${m},${d}).status=this.value"><option ${e.status==='Pendiente'?'selected':''}>Pendiente</option><option ${e.status==='En proceso'?'selected':''}>En proceso</option><option ${e.status==='Completado'?'selected':''}>Completado</option><option ${e.status==='Necesito ayuda'?'selected':''}>Necesito ayuda</option></select></label></div><button class="save" onclick="data.days['${k(m,d)}']=entry(${m},${d});persist('Día guardado')">Guardar este día</button>`}function progress(){return`<div><div class="hero"><h1>Mi progreso</h1><h2>Ruta 2027</h2><p>Resumen del camino vocal registrado.</p></div><div class="progress"><article><strong>${Object.values(data.days).filter(d=>d.status==='Completado').length}</strong><span>Días completados</span></article><article><strong>${data.artists.filter(a=>a.name).length}</strong><span>Artistas guardados</span></article><article><strong>${Object.keys(data.days).length}</strong><span>Días usados</span></article></div></div>`}render();</script></body></html>
