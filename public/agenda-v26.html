<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet"><title>Agenda Yeka 2027</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f7f9fd}iframe{width:100vw;height:100dvh;border:0;display:block}.dashBtn{position:fixed;left:22px;top:22px;width:56px;height:56px;border:0;border-radius:50%;background:linear-gradient(135deg,#ffc2ef,#c9e8ff);color:#fff;font-size:32px;z-index:999999;box-shadow:0 16px 34px rgba(20,33,61,.18);cursor:pointer}.dashBtn.open{left:322px}.mobileControls{display:none}@media(max-width:900px){.dashBtn{left:14px;top:14px;width:52px;height:52px}.dashBtn.open{left:14px}.mobileControls{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,440px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:999999}.mobileControls button{height:40px;border:0;border-radius:999px;font-family:'Patrick Hand',cursive!important;font-size:18px!important;color:#14213d;box-shadow:0 14px 28px rgba(20,33,61,.22)}.mobileControls button:nth-child(1){background:linear-gradient(90deg,#d8f4ca,#a4e6dd)}.mobileControls button:nth-child(2){background:linear-gradient(90deg,#eadbff,#ffc3e5)}.mobileControls button:nth-child(3){background:linear-gradient(90deg,#ffe3c8,#c3e2ff)}}</style></head><body><button id="dashBtn" class="dashBtn">☰</button><iframe id="agenda" src="/agenda-v21.html?v=21.9" title="Agenda Yeka 2027"></iframe><div class="mobileControls"><button id="prevBtn">← Retroceder</button><button id="saveBtn">Guardar agenda</button><button id="nextBtn">Avanzar →</button></div><script>const VIDEO='https://www.youtube.com/watch?v=8qwUtzzHTj4&t=37s';const STORE='agenda-yeka-platform-v21';function seed(){let s={};try{s=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}s.student=s.student||{name:'Yeka',email:'',phone:'',level:'',goal:'',registered:false};s.artists=s.artists||[{name:'',image:''},{name:'',image:''},{name:'',image:''}];s.notes=s.notes||{goals:'',routine:'',coach:''};s.days=s.days||{};s.insp=s.insp||'';s.likes=s.likes||'';s.saved=s.saved||false;s.bag=s.bag||false;for(let m=0;m<12;m++){let total=new Date(2027,m+1,0).getDate();for(let d=1;d<=total;d++){let k=`2027-${m+1}-${d}`;s.days[k]=s.days[k]||{video:'',learned:'',obs:'',status:'Pendiente'};s.days[k].video=VIDEO;if(!s.days[k].status)s.days[k].status='Pendiente'}}localStorage.setItem(STORE,JSON.stringify(s))}seed();const frame=document.getElementById('agenda'),dashBtn=document.getElementById('dashBtn');function fit(){frame.style.height=(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px'}fit();addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);function doc(){try{return frame.contentWindow.document}catch(e){return null}}function click(sel){let d=doc(),b=d&&d.querySelector(sel);if(b)b.click()}function toggleDash(){let d=doc(),dash=d&&d.querySelector('.dash');if(!dash)return;dash.classList.toggle('show');dashBtn.classList.toggle('open',dash.classList.contains('show'))}dashBtn.onclick=toggleDash;document.getElementById('prevBtn').onclick=()=>click('.controls .btn:first-child');document.getElementById('saveBtn').onclick=()=>click('.controls .save');document.getElementById('nextBtn').onclick=()=>click('.controls .btn:last-child');function suitcase(){return '<div class="blueSuitcaseIcon"><i class="b"></i><i class="line l1"></i><i class="line l2"></i><i class="line l3"></i><i class="tag"></i><i class="w w1"></i><i class="w w2"></i></div>'}function apply(){let d=doc();if(!d||d.getElementById('finalFix26'))return;let st=d.createElement('style');st.id='finalFix26';st.textContent='.app{display:block!important}.dash{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:300px!important;max-width:86vw!important;transform:translateX(-105%)!important;transition:transform .25s ease!important;z-index:999998!important}.dash.show{transform:translateX(0)!important}.openDash{display:none!important}.stage{width:100%!important}.videoBox>.field:first-child{display:none!important}.videoPreview{display:block!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;margin:0 0 14px!important}.videoEmbed{width:100%!important;aspect-ratio:16/9!important;border:0!important;border-radius:24px!important;box-shadow:0 18px 34px rgba(20,33,61,.16)!important;background:#111!important}.videoLabel{font:400 30px Patrick Hand,cursive!important;margin:0 0 10px!important;color:#14213d!important;background:#fff!important;display:inline-block!important;padding:2px 12px!important;border-radius:14px!important}.blueSuitcaseIcon{position:relative;display:block;width:min(250px,62vw);height:min(255px,62vw);margin:10px auto 0;filter:drop-shadow(0 22px 18px rgba(20,33,61,.22))}.blueSuitcaseIcon:before{content:"";position:absolute;left:50%;top:0;width:42%;height:30%;transform:translateX(-50%);border:13px solid #49365d;border-bottom:0;border-radius:18px 18px 0 0}.blueSuitcaseIcon .b{position:absolute;left:9%;right:9%;top:22%;bottom:8%;border-radius:27px;background:linear-gradient(135deg,#4ad7ff 0%,#278eea 55%,#1654c8 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.23);display:block}.blueSuitcaseIcon .line{position:absolute;top:36%;bottom:21%;width:13px;border-radius:99px;background:linear-gradient(#a1f5ff,#35b8ff)}.blueSuitcaseIcon .l1{left:26%}.blueSuitcaseIcon .l2{left:48%;opacity:.8}.blueSuitcaseIcon .l3{right:26%;opacity:.62}.blueSuitcaseIcon .tag{position:absolute;right:15%;top:31%;width:50px;height:38px;border-radius:5px;background:linear-gradient(135deg,#eadcff,#b7a9e5);transform:rotate(43deg);box-shadow:0 4px 8px rgba(20,33,61,.15)}.blueSuitcaseIcon .w{position:absolute;bottom:3%;width:19px;height:19px;border-radius:50%;background:#49365d}.blueSuitcaseIcon .w1{left:25%}.blueSuitcaseIcon .w2{right:25%}.cover .hero{font-size:0!important;display:grid!important;place-items:center!important}.cover .hero .blueSuitcaseIcon{width:min(270px,64vw);height:min(276px,64vw)}.bagBtn,.bigbag{font-size:0!important;background:transparent!important}.bagBtn .blueSuitcaseIcon{width:100px;height:96px;margin:0 auto}.bigbag .blueSuitcaseIcon{width:min(230px,62vw);height:min(230px,62vw)}@media(max-width:900px){.stage{padding-bottom:250px!important}.paper{margin-bottom:170px!important}.controls,.closed .controls{display:none!important}.cover{padding-bottom:95px!important}.blueSuitcaseIcon{width:min(220px,58vw)!important;height:min(225px,58vw)!important}.bagBtn .blueSuitcaseIcon{width:88px!important;height:84px!important}.bigbag .blueSuitcaseIcon{width:min(190px,54vw)!important;height:min(190px,54vw)!important}}';d.head.appendChild(st);function up(){d.querySelectorAll('.cover .hero,.bagBtn,.bigbag').forEach(el=>{if(!el.querySelector('.blueSuitcaseIcon'))el.innerHTML=suitcase()});d.querySelectorAll('.videoPreview').forEach(el=>{if(el.dataset.embedded==='1')return;el.dataset.embedded='1';el.innerHTML='<p class="videoLabel">Video asignado para la clase</p><iframe class="videoEmbed" src="https://www.youtube.com/embed/8qwUtzzHTj4?start=37&rel=0" title="Video asignado" allowfullscreen></iframe>'})}up();new MutationObserver(up).observe(d.body,{childList:true,subtree:true})}frame.addEventListener('load',()=>{setTimeout(apply,150);setTimeout(apply,700);setTimeout(apply,1500)});</script></body></html>
