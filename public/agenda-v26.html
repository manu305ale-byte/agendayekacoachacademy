<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka 2027</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f7f9fd}iframe{width:100vw;height:100dvh;border:0;display:block}.dashBtn{position:fixed;left:22px;top:22px;width:56px;height:56px;border:0;border-radius:50%;background:linear-gradient(135deg,#ffc2ef,#c9e8ff);color:#fff;font-size:32px;z-index:999999;box-shadow:0 16px 34px rgba(20,33,61,.18)}.mobileControls{display:none}@media(max-width:900px){.dashBtn{left:14px;top:14px;width:52px;height:52px}.mobileControls{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,440px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:999999}.mobileControls button{height:40px;border:0;border-radius:999px;font:400 16px 'Patrick Hand',cursive;color:#14213d;box-shadow:0 14px 28px rgba(20,33,61,.22)}.mobileControls button:nth-child(1){background:linear-gradient(90deg,#d8f4ca,#a4e6dd)}.mobileControls button:nth-child(2){background:linear-gradient(90deg,#eadbff,#ffc3e5)}.mobileControls button:nth-child(3){background:linear-gradient(90deg,#ffe3c8,#c3e2ff)}}</style></head><body><button class="dashBtn" onclick="toggleDash()">☰</button><iframe id="agenda" src="/agenda-v25.html?v=25.7" title="Agenda Yeka 2027"></iframe><div class="mobileControls"><button onclick="go(-1)">← Retroceder</button><button onclick="saveAgenda()">Guardar agenda</button><button onclick="go(1)">Avanzar →</button></div><script>const frame=document.getElementById('agenda');function fit(){frame.style.height=(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px'}fit();window.addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);function docIn(){try{let d=frame.contentWindow.document;for(let i=0;i<6;i++){let f=d.querySelector('iframe');if(!f)break;d=f.contentWindow.document}return d}catch(e){return null}}function toggleDash(){let d=docIn();let dash=d&&d.querySelector('.dash');if(dash)dash.classList.toggle('show')}function clickInner(sel){let d=docIn();let b=d&&d.querySelector(sel);if(b)b.click()}function go(n){clickInner(n<0?'.controls .btn:first-child':'.controls .btn:last-child')}function saveAgenda(){clickInner('.controls .save')}function suitcase(){return '<div class="blueSuitcaseIcon"><i class="b"></i><i class="line l1"></i><i class="line l2"></i><i class="line l3"></i><i class="tag"></i><i class="w w1"></i><i class="w w2"></i></div>'}function inject(){let d=docIn();if(!d||d.getElementById('blue-suitcase-final'))return;let st=d.createElement('style');st.id='blue-suitcase-final';st.textContent='.blueSuitcaseIcon{position:relative;display:block;width:min(250px,62vw);height:min(255px,62vw);margin:10px auto 0;filter:drop-shadow(0 22px 18px rgba(20,33,61,.22))}.blueSuitcaseIcon:before{content:"";position:absolute;left:50%;top:0;width:42%;height:30%;transform:translateX(-50%);border:13px solid #49365d;border-bottom:0;border-radius:18px 18px 0 0}.blueSuitcaseIcon .b{position:absolute;left:9%;right:9%;top:22%;bottom:8%;border-radius:27px;background:linear-gradient(135deg,#4ad7ff 0%,#278eea 55%,#1654c8 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.23);display:block}.blueSuitcaseIcon .line{position:absolute;top:36%;bottom:21%;width:13px;border-radius:99px;background:linear-gradient(#a1f5ff,#35b8ff)}.blueSuitcaseIcon .l1{left:26%}.blueSuitcaseIcon .l2{left:48%;opacity:.8}.blueSuitcaseIcon .l3{right:26%;opacity:.62}.blueSuitcaseIcon .tag{position:absolute;right:15%;top:31%;width:50px;height:38px;border-radius:5px;background:linear-gradient(135deg,#eadcff,#b7a9e5);transform:rotate(43deg);box-shadow:0 4px 8px rgba(20,33,61,.15)}.blueSuitcaseIcon .w{position:absolute;bottom:3%;width:19px;height:19px;border-radius:50%;background:#49365d}.blueSuitcaseIcon .w1{left:25%}.blueSuitcaseIcon .w2{right:25%}.cover .hero{font-size:0!important;display:grid!important;place-items:center!important}.cover .hero .blueSuitcaseIcon{width:min(270px,64vw);height:min(276px,64vw)}.bagBtn,.bigbag{font-size:0!important;background:transparent!important}.bagBtn .blueSuitcaseIcon{width:100px;height:96px;margin:0 auto}.bigbag .blueSuitcaseIcon{width:min(230px,62vw);height:min(230px,62vw)}@media(max-width:900px){.stage{padding-bottom:320px!important}.paper{margin-bottom:230px!important}.controls,.closed .controls{display:none!important}.cover{padding-bottom:155px!important}.blueSuitcaseIcon{width:min(220px,58vw)!important;height:min(225px,58vw)!important}.bagBtn .blueSuitcaseIcon{width:88px!important;height:84px!important}.bigbag .blueSuitcaseIcon{width:min(190px,54vw)!important;height:min(190px,54vw)!important}}';d.head.appendChild(st);function upgrade(){d.querySelectorAll('.cover .hero,.bagBtn,.bigbag').forEach(el=>{if(!el.querySelector('.blueSuitcaseIcon'))el.innerHTML=suitcase()})}upgrade();new MutationObserver(upgrade).observe(d.body,{childList:true,subtree:true})}frame.addEventListener('load',()=>{setTimeout(inject,250);setTimeout(inject,1000);setTimeout(inject,2200)});</script></body></html>
