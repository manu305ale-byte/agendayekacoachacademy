<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Vocal 2027</title><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@500;700;900&display=swap" rel="stylesheet"><style>:root{--ink:#14213d;--paper:#fffdf6;--line:#eadffd;--pink:#ff86bf;--mint:#a9eadf;--sky:#c3e2ff;--lav:#eadbff}*{box-sizing:border-box}html,body{margin:0;height:100dvh;overflow:hidden;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(90deg,#f8e8f2,#edf5ff)}body:before{content:"";position:fixed;inset:0;opacity:.28;pointer-events:none;background:url(/fondo-pagina.svg) repeat;background-size:360px 466px}.app{height:100dvh;display:grid;grid-template-columns:300px 1fr}.dash{background:#fffffff2;border-right:1px solid #edf0f7;box-shadow:18px 0 45px #14213d12;padding:22px 18px;overflow:auto;z-index:20}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:48px;height:48px;border-radius:17px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;font-size:24px}.brand b{display:block;font-size:22px}.brand small{color:#647089;font-weight:900;letter-spacing:.08em}.panel{background:white;border:1px solid #edf0f7;border-radius:24px;padding:15px;margin-bottom:14px;box-shadow:0 10px 24px #14213d0a}.panel h3,.nav button,.btn,.t h1,.t h2,.label,.videoTitle{font-family:'Patrick Hand',cursive}.panel h3{font-size:32px;margin:0 0 12px}.nav{display:grid;gap:8px}.nav button{border:0;border-radius:18px;background:linear-gradient(90deg,#fff,#f8f4ff);min-height:44px;text-align:left;padding:0 16px;color:var(--ink);font-size:25px;cursor:pointer}.nav button.on{background:linear-gradient(90deg,#ffe0f0,#dff3ff)}.stage{height:100dvh;overflow:auto;padding:30px 20px 128px;perspective:1600px}.wrap,.controls{width:min(760px,calc(100vw - 360px));margin:auto}.paper{position:relative;min-height:900px;background:var(--paper);border-radius:26px;padding:96px 52px 56px;box-shadow:0 28px 70px #14213d24;overflow:hidden;transform-origin:top center}.paper:before{content:"";position:absolute;inset:218px 52px 38px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,var(--line) 45px,var(--line) 47px);pointer-events:none;opacity:.7}.paper:after{content:"";position:absolute;right:16px;top:82px;bottom:56px;width:18px;border-radius:50%;background:linear-gradient(90deg,transparent,#10193226,transparent)}.paper .bg2{position:absolute;inset:0;background:url(/fondo-pagina.svg) repeat;background-size:390px 505px;opacity:.09;pointer-events:none}.rings{position:absolute;left:30px;right:30px;top:0;height:64px;z-index:5;background:url(/anillos.svg?v=3) center top/100% 100% no-repeat}.content{position:relative;z-index:2}.t{text-align:center;margin:0 auto 28px;background:linear-gradient(180deg,var(--paper) 0%,rgba(255,253,246,.94) 85%,transparent);padding:4px 10px 18px}.t h1{font-size:clamp(42px,4.2vw,60px);line-height:1.12;margin:0}.t h2{font-size:clamp(34px,3.2vw,46px);line-height:1.12;margin:6px 0 0;background:linear-gradient(90deg,#ef4f9d,#ff8a35,#18aaa3);-webkit-background-clip:text;color:transparent}.sub{display:inline-block;background:#fffdf6;border:1px solid #f0e9ff;border-radius:999px;padding:7px 17px;font-size:14px;color:#5f6c84;margin-top:12px;box-shadow:0 8px 18px #14213d0a}.cover{min-height:600px;display:grid;place-items:center;text-align:center}.suitcase{width:min(260px,62vw);height:min(260px,62vw);margin:auto;position:relative;filter:drop-shadow(0 22px 18px #14213d33)}.suitcase:before{content:"";position:absolute;left:50%;top:0;width:44%;height:30%;transform:translateX(-50%);border:13px solid #49365d;border-bottom:0;border-radius:20px 20px 0 0}.suitcase i{position:absolute;left:10%;right:10%;top:22%;bottom:8%;border-radius:28px;background:linear-gradient(135deg,#4ad7ff,#278eea 55%,#1654c8);box-shadow:inset 0 7px #ffffff38}.cover p{max-width:540px;background:#ffffffd9;border-radius:24px;padding:18px;color:#5c687f;line-height:1.65}.artists{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{min-height:260px;background:#fffffff2;border:2px solid #ffc8e1;border-radius:26px;padding:24px 14px 16px;display:grid;justify-items:center;box-shadow:0 14px 30px #14213d10;position:relative}.card:nth-child(2){border-color:#ffca9f}.card:nth-child(3){border-color:#a9eadf}.card:before{content:attr(data-n);position:absolute;left:-12px;top:-12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--lav));color:white;font-weight:900}.photo{width:128px;height:150px;border:3px solid currentColor;border-radius:18px;background:white;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#df4f8b;transform:rotate(-3deg)}.card:nth-child(2) .photo{color:#d66f37;transform:rotate(2deg)}.card:nth-child(3) .photo{color:#189b92;transform:rotate(-4deg)}.photo input{display:none}.photo img{width:100%;height:100%;object-fit:cover}.photo small{text-align:center;color:#69758c;font-size:12px;padding:10px}.card input{width:100%;height:44px;border:0;border-radius:14px;background:#fff4fa;margin-top:16px;text-align:center;font:400 25px 'Patrick Hand',cursive;color:var(--ink);padding:0 10px}.box{background:#fffffff0;border:1px solid #edf0f7;border-radius:24px;padding:18px;margin-top:18px;box-shadow:0 12px 24px #14213d0a}.label{font-size:34px;line-height:1.15;display:block;margin:0 0 12px;background:white;padding:2px 12px;border-radius:14px}.hand{width:100%;min-height:118px;border:0;outline:0;resize:vertical;background:repeating-linear-gradient(to bottom,transparent 0,transparent 38px,#ff86bf 39px,#ff86bf 41px,transparent 42px);font:400 25px/40px 'Patrick Hand',cursive;color:var(--ink);padding:0 12px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px}.wd{text-align:center;font-size:12px;font-weight:900;color:#66738c;background:#fffdf6;padding:3px;border-radius:10px}.day{min-height:58px;border:2px solid #c7b5ff;border-radius:14px;background:#fffffff0;display:grid;place-items:center;cursor:pointer;transition:.18s}.day:nth-child(4n+1){border-color:#ffb8d6}.day:nth-child(4n+2){border-color:#a9eadf}.day:nth-child(4n+3){border-color:#ffbd91}.day b{font-size:18px}.day small{font-size:8px;color:#66738c}.day.done{background:#e9fbf7;border-color:#25aaa2}.day:hover{transform:translateY(-3px);box-shadow:0 12px 20px #14213d18}.videoEmbed{width:100%;aspect-ratio:16/9;border:0;border-radius:24px;box-shadow:0 18px 34px #14213d29;background:#111}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:900;color:#5e6a82;text-transform:uppercase}.field select,.field textarea{width:100%;border:1px solid #dfe6f3;border-radius:14px;background:#fbfcff;min-height:48px;padding:10px;outline:0}.field textarea{min-height:150px;resize:vertical}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{background:white;border:1px solid #edf0f7;border-radius:24px;padding:22px;text-align:center;box-shadow:0 12px 24px #14213d10}.metric b{display:block;font:400 45px 'Patrick Hand',cursive}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}.btn{min-height:40px;border:0;border-radius:999px;padding:0 16px;font-size:22px;color:var(--ink);cursor:pointer;box-shadow:0 10px 22px #14213d14}.prev{background:linear-gradient(90deg,#d8f4ca,#a4e6dd)}.save{background:linear-gradient(90deg,#eadbff,#ffc3e5)}.next{background:linear-gradient(90deg,#ffe3c8,#c3e2ff)}.openDash{display:none;position:fixed;left:14px;top:14px;z-index:50;width:60px;height:60px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));color:white;font-size:34px;box-shadow:0 16px 34px #14213d2e}.pageUp{animation:up .65s cubic-bezier(.22,.84,.24,1)}.pageDown{animation:down .65s cubic-bezier(.22,.84,.24,1)}@keyframes up{from{transform:none;opacity:1}to{transform:translateY(-115px) rotateX(-95deg);opacity:.2}}@keyframes down{from{transform:translateY(-95px) rotateX(70deg);opacity:.2}to{transform:none;opacity:1}}@media(max-width:900px){.app{display:block}.dash{position:fixed;inset:0 auto 0 0;width:min(84vw,320px);transform:translateX(-105%);transition:.25s}.dash.show{transform:translateX(0)}.openDash{display:grid;place-items:center}.stage{padding:14px 10px 104px}.wrap,.controls{width:100%;max-width:440px}.paper{min-height:760px;padding:82px 16px 32px;border-radius:22px}.paper:before{inset:190px 18px 30px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 40px,var(--line) 42px)}.paper:after{display:none}.rings{left:18px;right:18px;top:0;height:52px}.t h1{font-size:40px}.t h2{font-size:31px}.artists,.metrics{grid-template-columns:1fr}.cal{gap:4px}.wd{font-size:9px}.day{min-height:47px;border-radius:11px;padding:2px}.day b{font-size:17px}.day small{font-size:7px}.controls{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;gap:7px}.btn{min-height:40px;font-size:18px;padding:0 8px}}</style></head><body><button class="openDash" onclick="dash()">☰</button><div class="app"><aside class="dash" id="dash"><div class="brand"><div class="logo">✈</div><div><b>Agenda Vocal</b><small>Yeka Coach Academy</small></div></div><section class="panel"><h3>Dashboard</h3><div class="nav" id="nav"></div></section></aside><main class="stage"><div class="wrap"><article class="paper" id="paper"><div class="bg2"></div><div class="rings"></div><div class="content" id="content"></div></article></div><div class="controls"><button class="btn prev" onclick="move(-1)">← Retroceder</button><button class="btn save" onclick="saveAll()">Guardar agenda</button><button class="btn next" onclick="move(1)">Avanzar →</button></div></main></div><script>const STORE='agenda-yeka-clean-v37',months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],video='https://www.youtube.com/embed/8qwUtzzHTj4?start=37&rel=0';let data=JSON.parse(localStorage.getItem(STORE)||'{}');data.artists=data.artists||[{name:'',image:''},{name:'',image:''},{name:'',image:''}];data.days=data.days||{};data.saved=data.saved||false;const pages=[{type:'cover',label:'Portada'},{type:'artists',label:'Cantantes'},...months.map((m,i)=>({type:'month',label:m,m:i})),{type:'summary',label:'Resumen'}];let page=Number(localStorage.getItem(STORE+'-page')||0),currentDay=null;function persist(){localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(STORE+'-page',page)}function title(h1,h2,sub=''){return `<div class="t"><h1>${h1}</h1><h2>${h2}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div>`}function rings(){return '<div class="rings"></div>'}function renderNav(){nav.innerHTML=pages.map((p,i)=>`<button class="${i==page?'on':''}" onclick="go(${i})">${p.label}</button>`).join('')}function render(){renderNav();let p=pages[page];let html='';if(currentDay){html=dayPage(currentDay)}else if(p.type==='cover'){html=title('Agenda vocal 2027','Calendario de viaje','Proyecto educativo personalizable')+`<section class="cover"><div class="suitcase"><i></i></div><p>Bienvenida/o. Esta agenda conserva una base visual común, pero cada alumno rellena sus artistas, videos y observaciones.</p></section>`}else if(p.type==='artists'){html=title('Cantantes que te inspiran','Maleta vocal','Sube imagen y nombre de tus artistas favoritos')+`<div class="artists">${data.artists.map((a,i)=>`<div class="card" data-n="${i+1}"><label class="photo"><input type="file" accept="image/*" onchange="img(${i},this)">${a.image?`<img src="${a.image}">`:'<small>Subir imagen</small>'}</label><input value="${a.name||''}" oninput="data.artists['+i+'].name=this.value;persist()" placeholder="Nombre"></div>`).join('')}</div><div class="box"><label class="label">¿Hay algo más que te inspira?</label><textarea class="hand" oninput="data.insp=this.value;persist()">${data.insp||''}</textarea></div>`}else if(p.type==='month'){html=monthPage(p.m)}else{html=summaryPage()}content.innerHTML=html;persist()}function monthPage(m){let first=new Date(2027,m,1).getDay(),days=new Date(2027,m+1,0).getDate();let blanks=(first+6)%7,items='<div class="cal">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="wd">${x}</div>`).join('')+'<div></div>'.repeat(blanks);for(let d=1;d<=days;d++){let k=`2027-${m+1}-${d}`,s=data.days[k]?.status||'Pendiente';items+=`<button class="day ${s==='Completado'?'done':''}" onclick="openDay(${m},${d})"><b>${d}</b><small>${s}</small></button>`}return title(months[m]+' 2027','Calendario de viaje','Selecciona un día para abrir su página individual')+items+'</div>'}function dayPage(x){let k=`2027-${x.m+1}-${x.d}`;data.days[k]=data.days[k]||{status:'Pendiente',learned:'',obs:''};let o=data.days[k];return title(`${x.d} de ${months[x.m]}`,'Página del día','Video asignado, aprendizaje y observaciones')+`<div class="box"><p class="videoTitle">Video asignado para la clase</p><iframe class="videoEmbed" src="${video}" allowfullscreen></iframe><div class="field"><label>Estado</label><select onchange="data.days['${k}'].status=this.value;persist()"><option ${o.status==='Pendiente'?'selected':''}>Pendiente</option><option ${o.status==='Completado'?'selected':''}>Completado</option></select></div></div><div class="field"><label>Aprendizaje del día</label><textarea oninput="data.days['${k}'].learned=this.value;persist()">${o.learned||''}</textarea></div><div class="field"><label>Observaciones</label><textarea oninput="data.days['${k}'].obs=this.value;persist()">${o.obs||''}</textarea></div>`}function summaryPage(){let total=0,done=0;Object.values(data.days).forEach(x=>{total++;if(x.status==='Completado')done++});return title('Resumen de viaje vocal','Progreso','Vista general del avance')+`<div class="metrics"><div class="metric"><b>${done}</b><span>Días completados</span></div><div class="metric"><b>${total}</b><span>Días guardados</span></div><div class="metric"><b>${data.artists.filter(a=>a.name||a.image).length}</b><span>Cantantes</span></div></div>`}function img(i,input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{data.artists[i].image=r.result;persist();render()};r.readAsDataURL(file)}function openDay(m,d){currentDay={m,d};animate(1);render()}function go(i){currentDay=null;page=i;animate(1);render();dash(false)}function move(n){if(currentDay){currentDay=null;render();return}page=Math.max(0,Math.min(pages.length-1,page+n));animate(n);render()}function animate(n){paper.classList.remove('pageUp','pageDown');void paper.offsetWidth;paper.classList.add(n>0?'pageUp':'pageDown');setTimeout(()=>paper.classList.remove('pageUp','pageDown'),650)}function dash(force){document.getElementById('dash').classList.toggle('show',force)}function saveAll(){data.saved=true;persist();alert('Agenda guardada')}render()</script></body></html>
