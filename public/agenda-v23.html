ata-v23','true');st.textContent=css;doc.head.appendChild(st)}function upgrade(){doc.querySelectorAll('.videoPreview').forEach(el=>{if(el.dataset.embedded==='1')return;el.dataset.embedded='1';el.innerHTML=`<p class="videoLabel">Video asignado para la clase</p><iframe class="videoEmbed" src="https://www.youtube.com/embed/8qwUtzzHTj4?start=37&rel=0" title="Video asignado" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`})}upgrade();if(!doc.body.dataset.v23Observer){doc.body.dataset.v23Observer='1';new MutationObserver(upgrade).observe(doc.body,{childList:true,subtree:true})}}frame.addEventListener('load',()=>{setTimeout(install,150);setTimeout(install,700);setTimeout(install,1500)});</script></body></html>
