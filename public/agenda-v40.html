<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka</title><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet"><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f7f9fd}iframe{width:100vw;height:100dvh;border:0;display:block}.mobileControls{display:none}@media(max-width:900px){.mobileControls{position:fixed;left:50%;top:calc(100vh - 72px);transform:translateX(-50%);width:min(94vw,440px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:2147483647;padding:0 4px}.mobileControls button{min-height:42px;border:0;border-radius:999px;font-family:'Patrick Hand',cursive!important;font-size:20px!important;line-height:.95;color:#14213d;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 14px 28px rgba(20,33,61,.22);padding:0 8px}.mobileControls button:nth-child(1){background:linear-gradient(90deg,#d8f4ca,#a4e6dd)}.mobileControls button:nth-child(2){background:linear-gradient(90deg,#eadbff,#ffc3e5);font-size:18px!important}.mobileControls button:nth-child(3){background:linear-gradient(90deg,#ffe3c8,#c3e2ff)}}</style></head><body><iframe id="agenda" src="/agenda-v37.html?v=37.11" title="Agenda Yeka"></iframe><div id="mobileControls" class="mobileControls"><button onclick="innerMove(-1)">← Retroceder</button><button onclick="innerSave()">Guardar<br>agenda</button><button onclick="innerMove(1)">Avanzar →</button></div><script>const frame=document.getElementById('agenda'),bar=document.getElementById('mobileControls'),STORE='agenda-yeka-clean-v37';function getWin(){return frame.contentWindow}function getDoc(){try{return getWin().document}catch(e){return null}}function getStore(){try{return JSON.parse(getWin().localStorage.getItem(STORE)||'{}')}catch(e){return {}}}function setStore(data){try{getWin().localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}}function placeBar(){if(!bar)return;const vv=window.visualViewport,h=vv?vv.height:innerHeight,top=(vv?vv.offsetTop:0)+h-bar.offsetHeight-16;bar.style.top=Math.max(0,top)+'px'}function fit(){frame.style.height=((visualViewport&&visualViewport.height)||innerHeight)+'px';placeBar()}fit();addEventListener('resize',fit);addEventListener('scroll',placeBar,{passive:true});if(visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',placeBar)}function onArtists(){const d=getDoc(),c=d&&d.getElementById('content'),t=(c&&c.innerText||'').toLowerCase();return t.includes('cantantes')||t.includes('artistas favoritos')||t.includes('sube imagen y nombre')}function scrapeArtists(){const d=getDoc();let s=getStore();s.artists=s.artists||[{},{},{}];const cards=d?[...d.querySelectorAll('#content .card')]:[];for(let i=0;i<3;i++){const card=cards[i];if(!s.artists[i])s.artists[i]={};if(card){const name=card.querySelector('input[type="text"],input:not([type])')?.value||s.artists[i].name||'';const img=card.querySelector('.photo img,img')?.getAttribute('src')||s.artists[i].image||'';s.artists[i].name=name;s.artists[i].image=img}}return s}window.saveArtistsToBag=function(){if(!onArtists())return false;let s=scrapeArtists();s.bagSaved=true;s.bagOpen=false;setStore(s);try{getWin().render&&getWin().render()}catch(e){}setTimeout(inject,60);setTimeout(inject,250);return true};function innerSave(){if(window.saveArtistsToBag())return;try{getWin().saveAll()}catch(e){}}function innerMove(n){try{getWin().move(n)}catch(e){}}function inject(){try{const d=getDoc();if(!d||!d.head)return;let st=d.getElementById('v40-fixes');if(!st){st=d.createElement('style');st.id='v40-fixes';d.head.appendChild(st)}st.textContent='.btn,.controls .btn,.nav button,.panel h3{font-family:"Patrick Hand",cursive!important;font-weight:400!important}.controls .btn{font-size:24px!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important}.vocalSuitcaseWrap{display:grid!important;place-items:center!important;gap:18px!important;min-height:430px!important;margin-top:22px!important}.vocalSuitcasePrompt{display:grid!important;grid-template-columns:1fr auto!important;align-items:end!important;gap:16px!important;margin:30px 0 10px!important;padding:14px 18px!important}.vocalSuitcasePrompt p{font-family:"Patrick Hand",cursive!important;font-size:32px!important;color:#14213d!important;margin:0!important;text-align:center!important}.vocalSuitcase,.vocalSuitcaseMini{position:relative!important;border:0!important;background:transparent!important;cursor:pointer!important;filter:drop-shadow(0 18px 16px rgba(20,33,61,.22))!important}.vocalSuitcase{width:min(300px,70vw)!important;height:min(300px,70vw)!important}.vocalSuitcaseMini{width:155px!important;height:125px!important}.vocalSuitcase:before,.vocalSuitcaseMini:before{content:""!important;position:absolute!important;left:50%!important;top:0!important;width:44%!important;height:30%!important;transform:translateX(-50%)!important;border:13px solid #49365d!important;border-bottom:0!important;border-radius:20px 20px 0 0!important}.vocalSuitcaseMini:before{border-width:8px!important;border-radius:12px 12px 0 0!important}.vocalSuitcase:after,.vocalSuitcaseMini:after{content:""!important;position:absolute!important;left:10%!important;right:10%!important;top:22%!important;bottom:8%!important;border-radius:28px!important;background:linear-gradient(135deg,#4ad7ff,#278eea 55%,#1654c8)!important;box-shadow:inset 0 7px rgba(255,255,255,.25)!important}.vocalSuitcaseMini:after{border-radius:16px!important}.bagHint{font-family:"Patrick Hand",cursive!important;font-size:30px!important;color:#14213d!important;background:#ffffffd9!important;padding:8px 18px!important;border-radius:18px!important;text-align:center!important}.bagGridCustom{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:14px!important;width:100%!important}.bagItem{background:#fffffff2!important;border:1px solid #edf0f7!important;border-radius:22px!important;padding:14px!important;box-shadow:0 12px 22px rgba(20,33,61,.12)!important;text-align:center!important}.bagItem img,.bagImgEmpty{width:100%!important;height:135px!important;object-fit:cover!important;border-radius:16px!important;background:#f2f5fb!important}.bagItem b{display:block!important;font-family:"Patrick Hand",cursive!important;font-size:26px!important;margin-top:8px!important}.bagCloseBtn{display:block!important;margin:18px auto 0!important;border:0!important;border-radius:999px!important;min-height:46px!important;padding:0 24px!important;background:linear-gradient(90deg,#eadbff,#ffc3e5)!important;color:#14213d!important;font-family:"Patrick Hand",cursive!important;font-size:28px!important;box-shadow:0 14px 28px rgba(20,33,61,.16)!important}@media(max-width:900px){.stage{padding-bottom:150px!important}.paper{margin-bottom:100px!important}.controls{display:none!important}.vocalSuitcasePrompt{grid-template-columns:1fr!important;place-items:center!important;margin-bottom:42px!important}.vocalSuitcasePrompt p{font-size:28px!important}.bagGridCustom{grid-template-columns:1fr!important}.bagItem img,.bagImgEmpty{height:180px!important}}';overrideSave();const content=d.getElementById('content');if(!content)return;const txt=(content.innerText||'').toLowerCase();if(txt.includes('cantantes')||txt.includes('artistas favoritos')||txt.includes('sube imagen y nombre'))patchArtists(d,content)}catch(e){}}function overrideSave(){try{const w=getWin();if(w.__v40SavePatched)return;const original=w.saveAll;w.saveAll=function(){if(parent&&parent.saveArtistsToBag&&parent.saveArtistsToBag())return;if(typeof original==='function')return original.apply(this,arguments)};w.__v40SavePatched=true}catch(e){}}function patchArtists(d,content){let data=getStore();data.artists=data.artists||[{},{},{}];content.querySelectorAll('.vocalSuitcaseWrap,.vocalSuitcasePrompt,.bagGridCustom,.bagCloseBtn').forEach(x=>x.remove());if(data.bagSaved){content.querySelector('.artists')?.remove();content.querySelector('.box')?.remove();const wrap=d.createElement('section');wrap.className='vocalSuitcaseWrap';if(data.bagOpen){wrap.innerHTML='<div class="bagGridCustom">'+data.artists.map(a=>'<div class="bagItem">'+(a.image?'<img src="'+a.image+'">':'<div class="bagImgEmpty"></div>')+'<b>'+(a.name||'Sin nombre')+'</b></div>').join('')+'</div><button class="bagCloseBtn" id="closeBagCustom">Cerrar maleta</button>'}else{wrap.innerHTML='<button class="vocalSuitcase" id="openBagCustom" aria-label="Abrir maleta vocal"></button><div class="bagHint">Haz clic en la maleta para abrir tus cantantes guardados</div>'}content.appendChild(wrap);const open=d.getElementById('openBagCustom');if(open)open.onclick=()=>{let s=getStore();s.bagOpen=true;setStore(s);try{getWin().render&&getWin().render()}catch(e){}setTimeout(inject,60)};const close=d.getElementById('closeBagCustom');if(close)close.onclick=()=>{let s=getStore();s.bagOpen=false;setStore(s);try{getWin().render&&getWin().render()}catch(e){}setTimeout(inject,60)}}else{const prompt=d.createElement('section');prompt.className='vocalSuitcasePrompt';prompt.innerHTML='<p>¡Vamos a llevarlos en tu maleta!</p><button class="vocalSuitcaseMini" id="saveBagCustom" aria-label="Guardar artistas en la maleta"></button>';content.appendChild(prompt);const save=d.getElementById('saveBagCustom');if(save)save.onclick=window.saveArtistsToBag}}frame.addEventListener('load',()=>{inject();placeBar();setTimeout(inject,300);setTimeout(inject,1000);setTimeout(inject,2000)});setInterval(()=>{inject();placeBar()},450);</script></body></html>
