<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka 2027</title><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@500;700;900&display=swap" rel="stylesheet"><style>:root{--ink:#14213d;--paper:#fffdf6;--line:#eadffd;--pink:#ff86bf;--mint:#a9eadf;--sky:#c3e2ff;--lav:#eadbff}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;font-family:Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 18%,#ffe3f2,transparent 25%),radial-gradient(circle at 92% 14%,#e0efff,transparent 28%),#f7f9fd}button,input,textarea,select{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:300px 1fr}.dash{background:#fffffff0;border-right:1px solid #edf0f7;box-shadow:18px 0 45px #14213d12;padding:22px 18px;overflow:auto;z-index:10}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:48px;height:48px;border-radius:17px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;font-size:24px}.brand b{display:block;font-size:22px}.brand small{color:#647089;font-weight:900;letter-spacing:.1em}.panel{background:#fff;border:1px solid #edf0f7;border-radius:24px;padding:15px;margin-bottom:14px;box-shadow:0 10px 24px #14213d0a}.panel.hidden{display:none}.panel h3,.nav button,.btn,.t h1,.t h2,.note h3,.prompt label,.bag h3,.videoTitle{font-family:'Patrick Hand',cursive}.panel h3{font-size:29px;line-height:1;margin:0 0 10px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:12px;font-weight:900;color:#5e6a82;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe6f3;border-radius:14px;background:#fbfcff;min-height:42px;padding:0 12px;outline:0}.field textarea{min-height:72px;padding:10px;resize:vertical}.nav{display:grid;gap:8px}.nav button{border:0;border-radius:16px;background:linear-gradient(90deg,#fff,#f8f4ff);min-height:40px;text-align:left;padding:0 12px;color:var(--ink);font-size:21px;cursor:pointer}.nav button.on{background:linear-gradient(90deg,#ffe0f0,#e0f4ff)}.stage{height:100dvh;overflow:auto;padding:30px 20px 118px;perspective:1600px}.wrap,.controls{width:min(760px,calc(100vw - 360px));margin:auto}.paper{position:relative;min-height:900px;background:var(--paper);border-radius:26px;padding:76px 52px 56px;box-shadow:0 28px 70px #14213d24;overflow:hidden;transform-origin:top center;animation:in .34s ease}.paper:before{content:"";position:absolute;inset:218px 52px 38px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,var(--line) 45px,var(--line) 47px);pointer-events:none;opacity:.78}.paper:after{content:"";position:absolute;right:16px;top:82px;bottom:56px;width:18px;border-radius:50%;background:linear-gradient(90deg,transparent,#10193226,transparent)}.rings{position:absolute;left:30px;right:30px;top:-30px;height:64px;display:flex;justify-content:space-between;z-index:3}.rings i{width:14px;height:64px;border:5px solid #181a20;border-bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(90deg,#111,#eee 45%,#111 70%)}.content{position:relative;z-index:2}.t{text-align:center;margin:0 auto 26px;position:relative;z-index:3;background:linear-gradient(180deg,var(--paper) 0%,rgba(255,253,246,.96) 78%,rgba(255,253,246,0) 100%);padding:4px 10px 18px}.t h1{font-size:clamp(42px,4.1vw,58px);line-height:1.16;margin:0;white-space:normal;overflow:visible}.t h2{font-size:clamp(34px,3.2vw,44px);line-height:1.18;margin:4px 0 0;background:linear-gradient(90deg,#ef4f9d,#ff8a35,#18aaa3);-webkit-background-clip:text;color:transparent;white-space:normal;overflow:visible;padding-bottom:4px}.sub{display:inline-block;background:#fffdf6;border:1px solid #f0e9ff;border-radius:999px;padding:6px 14px;font-size:13px;line-height:1.45;color:#5f6c84;margin-top:9px;box-shadow:0 8px 18px #14213d0a}.decor{position:absolute;inset:0;pointer-events:none;z-index:1}.decor:before{content:"";position:absolute;left:52px;top:92px;width:170px;height:66px;border-top:3px dashed #13203b24;border-radius:50%;transform:rotate(7deg)}.decor:after{content:"✈";position:absolute;right:62px;top:90px;font-size:28px;opacity:.42;transform:rotate(-14deg)}.cover{min-height:600px;display:grid;place-items:center;text-align:center}.cover .hero{font-size:230px;line-height:.9;filter:drop-shadow(0 22px 22px #14213d2b);animation:pulse 2.3s infinite}.cover p{max-width:510px;background:#ffffffd9;border-radius:22px;padding:15px 18px;color:#5c687f;line-height:1.65}.artists{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}.card{min-height:260px;background:#fffffff0;border:2px solid #ffc8e1;border-radius:26px;padding:24px 14px 16px;display:grid;justify-items:center;box-shadow:0 14px 30px #14213d10;position:relative}.card:nth-child(2){border-color:#ffca9f}.card:nth-child(3){border-color:#a9eadf}.card:before{content:attr(data-n);position:absolute;left:-12px;top:-12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--lav));color:white;font-weight:900}.photo{width:128px;height:150px;border:3px solid currentColor;border-radius:18px;background:white;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#df4f8b;transform:rotate(-3deg)}.card:nth-child(2) .photo{color:#d66f37;transform:rotate(2deg)}.card:nth-child(3) .photo{color:#189b92;transform:rotate(-4deg)}.photo input{display:none}.photo img{width:100%;height:100%;object-fit:cover}.photo small{text-align:center;color:#69758c;font-size:11px;padding:10px}.card input[type=text]{width:100%;height:42px;border:0;border-radius:14px;background:#fff4fa;margin-top:16px;text-align:center;font:400 24px 'Patrick Hand',cursive;color:var(--ink)}.prompt,.videoBox,.note{background:#fffffff0;border:1px solid #edf0f7;border-radius:24px;padding:18px;margin-top:18px;box-shadow:0 12px 24px #14213d0a}.prompt label,.bag h3{font-size:33px;line-height:1.15;display:block;text-align:center;margin:0 0 10px;background:#fff;padding:2px 8px;border-radius:14px}.hand{width:100%;height:112px;border:0;outline:0;resize:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 38px,#ff86bf 39px,#ff86bf 41px,transparent 42px);font:400 25px/40px 'Patrick Hand',cursive;color:var(--ink);padding:0 12px}.bagBtn{border:0;background:transparent;font-size:78px;cursor:pointer;filter:drop-shadow(0 12px 12px #14213d25);transition:.2s}.saveRow{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-top:14px}.bag{display:grid;place-items:center;text-align:center;min-height:590px}.bigbag{font-size:190px;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 24px 22px #14213d30);animation:pulse 2s infinite}.bagGrid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;animation:open .28s ease}.bagItem{background:white;border:1px solid #edf0f7;border-radius:22px;padding:14px;box-shadow:0 12px 22px #14213d12}.bagItem img{width:100%;height:120px;border-radius:16px;object-fit:cover;background:#f2f5fb}.bagItem b{display:block;font:400 25px 'Patrick Hand',cursive;margin-top:8px}.note h3{font-size:34px;margin:0 0 14px;background:#fff;display:inline-block;padding:2px 12px;border-radius:14px}.note textarea{width:100%;min-height:250px;border:0;outline:0;resize:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 42px,#a9eadf 43px,#a9eadf 45px);font:400 26px/43px 'Patrick Hand',cursive;color:var(--ink);padding:2px 10px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px}.wd{text-align:center;font-size:11px;font-weight:900;color:#66738c;background:#fffdf6;padding:3px;border-radius:10px}.day{min-height:52px;border:2px solid #c7b5ff;border-radius:14px;background:#fffffff0;display:grid;place-items:center;cursor:pointer;transition:.18s}.day:nth-child(4n+1){border-color:#ffb8d6}.day:nth-child(4n+2){border-color:#a9eadf}.day:nth-child(4n+3){border-color:#ffbd91}.day b{font-size:17px}.day small{font-size:7px;color:#66738c}.day.done{background:#e9fbf7;border-color:#25aaa2}.day:hover{transform:translateY(-3px);box-shadow:0 12px 20px #14213d18}.daybox{display:grid;gap:14px}.videoPreview{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid #edf0f7;border-radius:20px;padding:10px;margin:12px 0 4px;box-shadow:0 10px 22px #14213d0c}.thumb{width:160px;height:92px;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,#f3edff,#e5f6ff)}.videoTitle{font-size:25px;line-height:1.05;margin:0;color:#14213d}.videoUrl{font-size:12px;color:#68758f;word-break:break-all;margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.metric{background:white;border:1px solid #edf0f7;border-radius:24px;padding:22px;text-align:center;box-shadow:0 12px 24px #14213d10}.metric b{display:block;font:400 45px 'Patrick Hand',cursive}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}.btn{min-height:38px;border:0;border-radius:999px;padding:0 16px;font-size:20px;color:var(--ink);cursor:pointer;box-shadow:0 10px 22px #14213d14}.prev{background:linear-gradient(90deg,#d8f4ca,#a4e6dd)}.save{background:linear-gradient(90deg,#eadbff,#ffc3e5)}.next{background:linear-gradient(90deg,#ffe3c8,#c3e2ff)}.openDash{display:none;position:fixed;left:14px;top:14px;z-index:30;width:42px;height:42px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-size:22px}@keyframes in{from{opacity:.45;transform:translateY(26px) rotateX(12deg)}to{opacity:1;transform:none}}@keyframes up{to{transform:translateY(-125px) rotateX(-108deg);opacity:0}}@keyframes down{from{transform:translateY(-110px) rotateX(95deg);opacity:0}to{transform:none;opacity:1}}.paper.up{animation:up .55s cubic-bezier(.22,.84,.24,1) forwards}.paper.down{animation:down .55s cubic-bezier(.22,.84,.24,1) forwards}@keyframes pulse{50%{transform:translateY(-6px) scale(1.03)}}@keyframes open{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(max-width:900px){.app{display:block}.dash{position:fixed;inset:0 auto 0 0;width:min(84vw,320px);transform:translateX(-105%);transition:.25s}.dash.show{transform:translateX(0)}.openDash{display:grid;place-items:center}.stage{padding:14px 10px 98px}.wrap,.controls{width:100%;max-width:440px}.paper{min-height:760px;padding:62px 16px 30px;border-radius:22px}.paper:before{inset:190px 18px 30px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 40px,var(--line) 42px)}.paper:after,.decor{display:none}.rings{left:18px;right:18px;top:-25px}.rings i{width:12px;height:52px;border-width:4px}.t h1{font-size:38px;line-height:1.18}.t h2{font-size:30px;line-height:1.18}.artists,.bagGrid,.metrics{grid-template-columns:1fr}.card{min-height:240px}.cal{gap:4px}.wd{font-size:9px}.day{min-height:45px;border-radius:10px;padding:2px}.day b{font-size:16px}.day small{font-size:6px}.controls{position:sticky;bottom:12px;gap:7px}.btn{min-height:36px;font-size:16px;padding:0 7px}.bigbag{font-size:145px}.cover .hero{font-size:155px}.videoPreview{grid-template-columns:1fr}.thumb{width:100%;height:150px}}</style></head><body><button class="openDash" onclick="dash()">☰</button><div class="app"><aside class="dash" id="dash"><div class="brand"><div class="logo">✈</div><div><b>Agenda Vocal</b><small>Yeka Coach Academy</small></div></div><section class="panel" id="studentPanel"><h3>Registro del alumno</h3><div class="field"><label>Nombre</label><input id="name"></div><div class="field"><label>Correo</label><input id="email"></div><div class="field"><label>Teléfono</label><input id="phone"></div><div class="field"><label>Nivel vocal</label><select id="level"><option></option><option>Inicial</option><option>Intermedio</option><option>Avanzado</option></select></div><div class="field"><label>Objetivo</label><textarea id="goal"></textarea></div><button class="btn save" onclick="saveStudent()">Guardar alumno</button></section><section class="panel"><h3>Dashboard</h3><div class="nav" id="nav"></div></section></aside><main class="stage"><div class="wrap"><section class="paper" id="paper"><div class="rings" id="rings"></div><div class="decor"></div><div class="content" id="content"></div></section></div><div class="controls"><button class="btn prev" onclick="move(-1)">← Retroceder</button><button class="btn save" onclick="saveAll()">Guardar agenda</button><button class="btn next" onclick="move(1)">Avanzar →</button></div></main></div><script>const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],pages=['cover','artists','goals','routine',...months.map((_,i)=>'month-'+i),'progress','coach','back'];const STORE='agenda-yeka-platform-v21';let s=JSON.parse(localStorage.getItem(STORE)||'{}');s.student=s.student||{name:'Yeka',email:'',phone:'',level:'',goal:'',registered:false};s.artists=s.artists||[{name:'',image:''},{name:'',image:''},{name:'',image:''}];s.notes=s.notes||{goals:'',routine:'',coach:''};s.days=s.days||{};s.insp=s.insp||'';s.likes=s.likes||'';s.saved=s.saved||false;s.bag=s.bag||false;let page=0,sel=null;function q(id){return document.getElementById(id)}function e(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function store(){localStorage.setItem(STORE,JSON.stringify(s))}function ttl(a,b,c){return `<div class="t"><h1>${a}</h1>${b?`<h2>${b}</h2>`:''}${c?`<p class="sub">${c}</p>`:''}</div>`}function k(m,d){return `2027-${m+1}-${d}`}function de(m,d){let kk=k(m,d);if(!s.days[kk])s.days[kk]={video:'',learned:'',obs:'',status:'Pendiente'};return s.days[kk]}function ytId(u){let m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{6,})/);return m?m[1]:''}function videoCard(u){let id=ytId(u),img=id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:'';return u?`<div class="videoPreview">${img?`<img class="thumb" src="${img}">`:`<div class="thumb"></div>`}<div><p class="videoTitle">Video asignado para la clase</p><div class="videoUrl">${e(u)}</div></div></div>`:''}function render(){q('rings').innerHTML=Array.from({length:18},()=>'<i></i>').join('');nav();loadStudent();let p=pages[page],h='';if(sel)h=day(sel.m,sel.d);else if(p==='cover')h=cover();else if(p==='artists')h=artists();else if(p==='goals')h=note('Mis metas vocales','Objetivos del viaje','goals','Personaliza tus metas, canciones y habilidades.');else if(p==='routine')h=note('Rutina de práctica','Plan de entrenamiento','routine','Respiración, calentamiento, afinación y repertorio.');else if(p.startsWith('month-'))h=month(+p.split('-')[1]);else if(p==='progress')h=progress();else if(p==='coach')h=note('Notas del coach','Seguimiento personalizado','coach','Observaciones del profesor.');else h=back();q('content').innerHTML=h;store()}function nav(){let labels=['Portada','Cantantes','Objetivos','Rutina',...months,'Progreso','Coach','Cierre'];q('nav').innerHTML=labels.map((x,i)=>`<button class="${i===page?'on':''}" onclick="go(${i})">${x}</button>`).join('')}function cover(){return ttl('Agenda vocal 2027','Calendario de viaje','Proyecto educativo personalizable')+`<div class="cover"><div class="hero">🧳</div><p>Bienvenida/o <b>${e(s.student.name)}</b>. Esta agenda conserva una base visual común, pero cada alumno rellena sus datos, artistas, videos y observaciones.</p></div>`}function artists(){if(s.saved)return ttl('Top 3 de cantantes','que te inspiran','Toca la maleta para abrir tus artistas')+`<div class="bag"><button class="bigbag" onclick="s.bag=!s.bag;render()">🧳</button><h3>Mi maleta vocal</h3>${s.bag?bagGrid():''}<button class="btn save" onclick="s.saved=false;s.bag=false;render()">Editar artistas</button></div>`;return ttl('Top 3 de cantantes','que te inspiran','Sube imagen y nombre de tus artistas favoritos')+`<div class="artists">${s.artists.map((a,i)=>`<article class="card" data-n="${i+1}"><label class="photo">${a.image?`<img src="${a.image}">`:'<small>Adjuntar imagen</small>'}<input type="file" accept="image/*" onchange="up(${i},this)"></label><input type="text" placeholder="Nombre" value="${e(a.name)}" oninput="s.artists[${i}].name=this.value;store()"></article>`).join('')}</div><div class="prompt"><label>¿Hay algo más que te inspira?</label><textarea class="hand" oninput="s.insp=this.value;store()">${e(s.insp)}</textarea><label>¿Qué te gusta de estos artistas?</label><textarea class="hand" oninput="s.likes=this.value;store()">${e(s.likes)}</textarea><div class="saveRow"><span class="sub">¡Vamos a llevarlos en tu maleta!</span><button class="bagBtn" onclick="s.saved=true;s.bag=false;render()">🧳</button></div></div>`}function bagGrid(){return `<div class="bagGrid">${s.artists.map(a=>`<article class="bagItem">${a.image?`<img src="${a.image}">`:'<img>'}<b>${e(a.name||'Artista')}</b></article>`).join('')}</div>`}function note(a,b,key,sub){return ttl(a,b,sub)+`<div class="note"><h3>Notas</h3><textarea oninput="s.notes.${key}=this.value;store()">${e(s.notes[key])}</textarea></div>`}function month(m){let first=new Date(2027,m,1).getDay(),total=new Date(2027,m+1,0).getDate(),c=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(x=>`<div class="wd">${x}</div>`).join('');for(let i=0;i<first;i++)c+='<div></div>';for(let d=1;d<=total;d++){let x=s.days[k(m,d)]||{};c+=`<button class="day ${x.status==='Completado'?'done':''}" onclick="sel={m:${m},d:${d}};render()"><b>${d}</b><small>${x.status||'Pendiente'}</small></button>`}return ttl(months[m]+' 2027','Calendario de viaje vocal','Selecciona un día para abrir su página individual')+`<div class="cal">${c}</div>`}function day(m,d){let x=de(m,d);return ttl(`${d} de ${months[m]}`,'Página del día','Video asignado, aprendizaje y observaciones.')+`<div class="daybox"><div class="videoBox"><div class="field"><label>Link del video</label><input value="${e(x.video)}" placeholder="Pega aquí el enlace de YouTube" oninput="de(${m},${d}).video=this.value;store();render()"></div>${videoCard(x.video)}<div class="field"><label>Estado</label><select onchange="de(${m},${d}).status=this.value;store()"><option ${x.status==='Pendiente'?'selected':''}>Pendiente</option><option ${x.status==='Completado'?'selected':''}>Completado</option></select></div></div><div class="note"><h3>¿Qué aprendiste hoy?</h3><textarea oninput="de(${m},${d}).learned=this.value;store()">${e(x.learned)}</textarea></div><div class="note"><h3>Observaciones</h3><textarea oninput="de(${m},${d}).obs=this.value;store()">${e(x.obs)}</textarea></div><button class="btn prev" onclick="sel=null;render()">← Volver al mes</button></div>`}function progress(){let all=Object.values(s.days),done=all.filter(x=>x.status==='Completado').length;return ttl('Progreso vocal','Resumen del viaje','Avance personal del alumno')+`<div class="metrics"><div class="metric"><b>${done}</b>Días completados</div><div class="metric"><b>${s.saved?3:0}</b>Artistas guardados</div><div class="metric"><b>${all.length}</b>Días abiertos</div></div>`}function back(){return ttl('Fin del viaje','Sigue cantando','Constancia, memoria y emoción')+`<div class="cover"><div class="hero">🧳🎶</div><p>Tu agenda queda guardada en este navegador y puede seguir creciendo como plataforma educativa.</p></div>`}function up(i,el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{s.artists[i].image=r.result;render()};r.readAsDataURL(f)}function move(n){let p=q('paper');p.classList.remove('up','down');void p.offsetWidth;p.classList.add(n>0?'up':'down');setTimeout(()=>{if(sel)sel=null;else page=Math.max(0,Math.min(pages.length-1,page+n));p.classList.remove('up','down');render()},350)}function go(i){sel=null;page=i;q('dash').classList.remove('show');render()}function saveAll(){store();q('content').animate([{transform:'scale(1)'},{transform:'scale(1.015)'},{transform:'scale(1)'}],{duration:320})}function dash(){q('dash').classList.toggle('show')}function loadStudent(){['name','email','phone','level','goal'].forEach(k=>{let el=q(k);if(el)el.value=s.student[k]||''});if(s.student.registered)q('studentPanel').classList.add('hidden')}function saveStudent(){['name','email','phone','level','goal'].forEach(k=>s.student[k]=q(k).value);s.student.registered=true;render()}render();</script></body></html>
