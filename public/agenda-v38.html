ortant;border:13px solid #49365d!important;border-bottom:0!important;border-radius:20px 20px 0 0!important}.vocalSuitcase:after{content:""!important;position:absolute!important;left:10%!important;right:10%!important;top:22%!important;bottom:8%!important;border-radius:28px!important;background:linear-gradient(135deg,#4ad7ff,#278eea 55%,#1654c8)!important;box-shadow:inset 0 7px rgba(255,255,255,.25)!important}.bagHint{font-family:"Patrick Hand",cursive!important;font-size:30px!important;color:#14213d!important;background:#ffffffd9!important;padding:8px 18px!important;border-radius:18px!important}.bagGridCustom{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:14px!important;width:100%!important}.bagGridCustom .bagItem{background:#fffffff2!important;border:1px solid #edf0f7!important;border-radius:22px!important;padding:14px!important;box-shadow:0 12px 22px rgba(20,33,61,.12)!important;text-align:center!important}.bagGridCustom img{width:100%!important;height:135px!important;object-fit:cover!important;border-radius:16px!important;background:#f2f5fb!important}.bagGridCustom b{display:block!important;font-family:"Patrick Hand",cursive!important;font-size:26px!important;margin-top:8px!important}@media(max-width:900px){.stage{padding-bottom:150px!important}.paper{margin-bottom:100px!important}.controls{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}.bagGridCustom{grid-template-columns:1fr!important}.bagGridCustom img{height:180px!important}}';const content=d.getElementById('content');if(content){const title=(content.querySelector('h1')?.textContent||'').toLowerCase();if(title.includes('cantantes que te inspiran')){patchArtists(d,content)}}}catch(e){}}function getStore(){try{return JSON.parse(frame.contentWindow.localStorage.getItem('agenda-yeka-clean-v37')||'{}')}catch(e){return {}}}function setStore(data){try{frame.contentWindow.localStorage.setItem('agenda-yeka-clean-v37',JSON.stringify(data))}catch(e){}}function patchArtists(d,content){let data=getStore();data.artists=data.artists||[{},{},{}];if(data.bagSaved){const opened=data.bagOpen;const artists=data.artists;content.querySelector('.artists')?.remove();content.querySelector('.box')?.remove();if(!content.querySelector('.vocalSuitcaseWrap')){const wrap=d.createElement('section');wrap.className='vocalSuitcaseWrap';wrap.innerHTML=opened?'<div class="bagGridCustom">'+artists.map(a=>'<div class="bagItem">'+(a.image?'<img src="'+a.image+'">':'<div style="height:135px;border-radius:16px;background:#f2f5fb"></div>')+'<b>'+(a.name||'Sin nombre')+'</b></div>').join('')+'</div><button class="bagSaveBtn" id="closeBagCustom">Cerrar maleta</button>':'<button class="vocalSuitcase" id="openBagCustom" aria-label="Abrir maleta vocal"></button><div class="bagHint">Haz clic en la maleta para ver tus cantantes guardados</div>';content.appendChild(wrap);const open=d.getElementById('openBagCustom');if(open)open.onclick=()=>{let s=getStore();s.bagOpen=true;setStore(s);frame.contentWindow.render&&frame.contentWindow.render();setTimeout(inject,80)};const close=d.getElementById('closeBagCustom');if(close)close.onclick=()=>{let s=getStore();s.bagOpen=false;setStore(s);frame.contentWindow.render&&frame.contentWindow.render();setTimeout(inject,80)}}}else if(!content.querySelector('.bagSaveBtn')){const btn=d.createElement('button');btn.className='bagSaveBtn';btn.textContent='Guardar en la maleta';btn.onclick=()=>{let s=getStore();s.bagSaved=true;s.bagOpen=false;setStore(s);frame.contentWindow.render&&frame.contentWindow.render();setTimeout(inject,80)};content.appendChild(btn)}}frame.addEventListener('load',()=>{inject();placeBar();setTimeout(inject,300);setTimeout(inject,1000);setTimeout(inject,2000);setTimeout(placeBar,300)});setInterval(()=>{inject();placeBar()},900);</script></body></html>
