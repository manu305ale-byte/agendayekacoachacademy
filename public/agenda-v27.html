<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Yeka 2027</title><style>html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f7f9fd}iframe{width:100vw;height:100dvh;border:0;display:block}.dashBtn{position:fixed;left:22px;top:22px;width:56px;height:56px;border:0;border-radius:50%;background:linear-gradient(135deg,#ffc2ef,#c9e8ff);color:white;font-size:32px;z-index:20;box-shadow:0 16px 34px rgba(20,33,61,.18)}@media(max-width:900px){.dashBtn{left:14px;top:14px;width:52px;height:52px}}</style></head><body><button class="dashBtn" onclick="toggleDash()">☰</button><iframe id="agenda" src="/agenda-v26.html?v=26.3" title="Agenda Yeka 2027"></iframe><script>const frame=document.getElementById('agenda');function fit(){frame.style.height=(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px'}fit();window.addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);function docIn(){try{let d=frame.contentWindow.document;for(let i=0;i<4;i++){let f=d.querySelector('iframe');if(!f)break;d=f.contentWindow.document}return d}catch(e){return null}}function toggleDash(){let d=docIn();let dash=d&&d.querySelector('.dash');if(dash)dash.classList.toggle('show')}</script></body></html>
